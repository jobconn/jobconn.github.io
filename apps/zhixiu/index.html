<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智修 · 智能体的自我修炼辅助工具</title>
<meta name="description" content="智修 —— 用修炼的方式学会驾驭 Agent（AI 智能体）。面向非 IT 职场人的零基础修炼路线：41 个知识节点、85 个 5–10 分钟微关，你当灵魂、AI 当手脚。">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f1e9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f7d63'/%3E%3Ctext x='32' y='45' font-size='36' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E4%BF%AE%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f1e9; --surface:#fffdf8; --surface2:#faf7ef;
  --ink:#241f18; --ink2:#5b5548; --ink3:#948c7c;
  --line:#e7e0d1; --line2:#efe9db;
  --jade:#2f7d63; --jade-d:#235e4a; --jade-soft:#e3efe9; --jade-ink:#1b5540;
  --gold:#b98a2f; --gold-soft:#f7ecd6; --gold-ink:#8a6520;
  --know:#3a6ea5; --know-soft:#e7eff8;
  --apply:#2f7d63; --apply-soft:#e3efe9;
  --duty:#b5651d; --duty-soft:#f8ebe0;
  --shadow:0 1px 2px rgba(35,31,24,.05),0 10px 28px -14px rgba(35,31,24,.16);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit}

/* ---- shell ---- */
.app{display:flex;min-height:100vh}
.side{
  width:236px;flex:0 0 236px;position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,#fffdf8,#f8f4ea);border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:radial-gradient(circle at 30% 25%,#3d9a79,#235e4a);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;
  box-shadow:0 6px 16px -6px rgba(35,94,74,.6)
}
.brand .bt{font-weight:700;font-size:17px;letter-spacing:.5px}
.brand .bs{font-size:11px;color:var(--ink3);line-height:1.35}
.navbtn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:12px;
  background:transparent;color:var(--ink2);font-size:14.5px;cursor:pointer;text-align:left;width:100%
}
.navbtn:hover{background:#f1ece0}
.navbtn.on{background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.navbtn svg{width:18px;height:18px;flex:0 0 18px}
.side .foot{margin-top:auto;font-size:11px;color:var(--ink3);padding:10px 10px 0;border-top:1px dashed var(--line)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:rgba(244,241,233,.86);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:14px
}
.topbar .tb-brand{display:none;align-items:center;gap:9px;font-weight:700}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.chip.gold{background:var(--gold-soft);border-color:#ecd9b0;color:var(--gold-ink);font-weight:600}
.chip.jade{background:var(--jade-soft);border-color:#cbe4d9;color:var(--jade-ink);font-weight:600}
.wrap{width:100%;max-width:940px;margin:0 auto;padding:24px 20px 130px}

/* ---- tabbar (mobile) ---- */
.tabbar{display:none}

/* ---- generic ---- */
.h1{font-size:23px;font-weight:700;margin:0 0 4px;letter-spacing:.3px}
.h2{font-size:17px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.h2 .dot{width:8px;height:8px;border-radius:3px;background:var(--jade)}
.sub{color:var(--ink3);font-size:13.5px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.muted{color:var(--ink3);font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);color:var(--ink3)}
.tag.k{background:var(--know-soft);border-color:#d3e2f2;color:#2d5c8f}
.tag.a{background:var(--apply-soft);border-color:#cbe4d9;color:var(--jade-ink)}
.tag.d{background:var(--duty-soft);border-color:#eed6c2;color:#96530f}
.tag.stable{background:#eef4ef;border-color:#d6e6dc;color:#356b52}
.tag.fast{background:#fdeee7;border-color:#f6d3c2;color:#a9522a}
.tag.mix{background:#f4f0e0;border-color:#e7dcb6;color:#7c6a24}

/* ---- hero ---- */
.hero{display:flex;gap:24px;align-items:center;padding:24px 26px;border-radius:22px;
  background:linear-gradient(135deg,#ffffff 0%,#f6f3ea 55%,#eef4ee 100%);
  border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .col{flex:1;min-width:0}
.hero .eyebrow{font-size:12px;letter-spacing:2px;color:var(--jade);font-weight:700;margin-bottom:8px}
.hero h1{margin:0 0 6px;font-size:26px;line-height:1.35}
.hero p{margin:0;color:var(--ink2);font-size:13.5px}
.hero .acts{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btn{
  border:0;border-radius:12px;padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;
  background:var(--jade);color:#fff;box-shadow:0 8px 18px -8px rgba(47,125,99,.8);transition:.15s
}
.btn:hover{background:var(--jade-d);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.done{background:#e9efe9;color:#4c6b57;box-shadow:none;cursor:default}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:26px;line-height:1}
.ring .mid span{font-size:11px;color:var(--ink3);margin-top:3px}

.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:12px;color:var(--ink3)}

/* ---- stage bars ---- */
.stages{display:grid;grid-template-columns:1fr;gap:9px}
.stage{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.stage.on{border-color:#cbe4d9;background:linear-gradient(90deg,#eef6f1,#fffdf8)}
.stage .nm{width:120px;flex:0 0 120px;font-size:13.5px;font-weight:600}
.bar{flex:1;height:8px;border-radius:99px;background:#eae4d6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3d9a79,#2f7d63);width:0;transition:width .5s}
.stage .num{font-size:12px;color:var(--ink3);width:66px;text-align:right;flex:0 0 66px}

/* ---- level groups ---- */
details.grp{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
details.grp>summary{
  list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px
}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .arw{margin-left:auto;color:var(--ink3);transition:.2s;font-size:12px}
details.grp[open]>summary .arw{transform:rotate(90deg)}
details.grp>summary .mini{font-size:12px;color:var(--ink3);font-weight:500}
.nodeblk{padding:0 12px 12px}
.nodehead{display:flex;align-items:baseline;gap:9px;padding:10px 6px 8px;border-top:1px dashed var(--line2)}
.nodehead .nid{font-weight:700;color:var(--jade);font-size:12.5px}
.nodehead .nname{font-weight:600;font-size:14px}
.nodehead .ngoal{font-size:12px;color:var(--ink3)}
.lv{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:.12s
}
.lv:hover{background:#f6f2e8;border-color:var(--line)}
.lv.cur{background:#eef6f1;border-color:#cbe4d9}
.lv .mk{
  width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid #d8d1c1;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff
}
.lv.ok .mk{background:var(--jade);border-color:var(--jade)}
.lv.ok .lt{color:var(--ink3);text-decoration:line-through;text-decoration-color:#c9c2b2}
.lv .lt{font-size:14px;font-weight:500}
.lv .lid{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lv .lact{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}
/* ★ v0.8.0「⭐选读」标记（v1.4 §2.3）：选读关默认折叠、不计入段位与毕业门槛 */
.osel{margin-left:6px;font-size:10.5px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border:1px solid #ecd9b0;border-radius:999px;padding:1px 6px;white-space:nowrap;vertical-align:1px}
.optnote{margin:9px 0 3px;font-size:12.5px;line-height:1.6;color:var(--gold-ink);background:var(--gold-soft);border:1px solid #ecd9b0;border-radius:10px;padding:8px 10px}

/* ---- map ---- */
.axes{display:grid;gap:16px}
.axis{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.axis .axh{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.axis .axh .axn{font-weight:700;font-size:16px}
.axis .axh .axq{font-size:12.5px;color:var(--ink3)}
.axis .axb{padding:14px 18px}
.branch{margin-bottom:14px}
.branch:last-child{margin-bottom:0}
.branch .bh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.branch .bh b{font-size:14px}
.branch .bh span{font-size:11.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.ncard{border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--surface2);cursor:pointer;transition:.14s}
.ncard:hover{background:#fff;border-color:#d8d1c1;transform:translateY(-2px);box-shadow:var(--shadow)}
.ncard .nt{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ncard .nid{font-size:11px;font-weight:700;color:#fff;background:var(--ink3);padding:1px 7px;border-radius:6px}
.ncard .nid.k{background:var(--know)}.ncard .nid.a{background:var(--apply)}.ncard .nid.d{background:var(--duty)}
.ncard .nn{font-size:13.5px;font-weight:600;line-height:1.35}
.ncard .ng{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard .nf{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3)}
.ncard .nbar{flex:1;height:5px;border-radius:99px;background:#e8e2d4;overflow:hidden}
.ncard .nbar i{display:block;height:100%;background:var(--jade);width:0}

.ringview{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step{border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--surface2);position:relative}
.step b{font-size:13.5px;display:block;margin-bottom:3px}
.step .k{font-size:10.5px;font-weight:700;color:var(--jade);letter-spacing:1px}
.step p{margin:0;font-size:11.5px;color:var(--ink3);line-height:1.5}

/* ---- rank ---- */
.ladder{display:grid;gap:8px}
.rung{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rung.on{border-color:#ecd9b0;background:linear-gradient(90deg,#fdf6e6,#fffdf8);box-shadow:0 6px 16px -12px rgba(185,138,47,.7)}
.rung .rk{width:64px;flex:0 0 64px;font-weight:700;font-size:15px}
.rung.on .rk{color:var(--gold-ink)}
.rung .rd{flex:1;font-size:12.5px;color:var(--ink3)}
.rung .rq{font-size:12px;color:var(--ink3)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.ach{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.ach.locked{opacity:.5}
.ach .badge{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--gold-soft)}
.ach.locked .badge{background:#eee9dc;filter:grayscale(1)}
.ach b{font-size:13.5px;display:block}
.ach span{font-size:11.5px;color:var(--ink3)}

/* ---- glossary ---- */
.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:13px;background:var(--surface);font-size:14px;margin-bottom:14px}
.search:focus{outline:none;border-color:#bcd8cb}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}
.gitem{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:var(--surface)}
.gitem b{font-size:14px}
.gitem p{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}

/* ---- filters ---- */
/* v0.3.1 单行芯片条：只占一行、横向滑动（旧版 flex-wrap 在窄屏会摊成 3 行 ~150px） */
.filters{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;margin:0 0 14px}
.flab{font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:1px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;line-height:16px;cursor:pointer;color:var(--ink2);transition:.12s;flex:0 0 auto;white-space:nowrap}
.fchip:hover{background:var(--surface2);border-color:#d8d1c1}
.fchip.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}
.fsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.mnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bhh{cursor:pointer}
.bhh:hover b{color:var(--jade-ink)}

/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(28,24,18,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.mclose{position:sticky;top:0;float:right;border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--ink2)}
.mlvl-id{font-size:12px;font-weight:700;color:var(--jade);letter-spacing:1px}
.mlvl-t{font-size:21px;font-weight:700;margin:2px 0 4px}
.mrow{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line2)}
.mrow>.k{width:92px;flex:0 0 92px;white-space:nowrap;font-size:12.5px;color:var(--ink3);padding-top:2px}
.mrow .v{flex:1;font-size:14px}

/* ---- 关卡卡五段式（v0.4.5 样板间）：学→做→证→源→打卡 ---- */
.seg{border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden;background:var(--surface)}
.seg-h{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--surface2);font-weight:600;font-size:14px;color:var(--ink)}
.seg-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--jade);color:#fff;font-size:12px;flex:0 0 22px}
.seg-b{padding:13px 15px}
.seg-b .mrow:first-child{border-top:0}
.seg-teach{box-shadow:inset 0 0 0 1px #cfe3da}
.seg-teach .seg-h{background:var(--jade-soft);color:var(--jade-ink)}
.teach{font-size:14px;line-height:1.74;color:var(--ink);white-space:pre-wrap}
.seg-muted .seg-h{background:var(--surface2);color:var(--ink3);font-weight:500}
.seg-muted .seg-n{background:var(--ink3)}
.seg-src>summary{list-style:none;cursor:pointer}
.seg-src>summary::-webkit-details-marker{display:none}
.seg-src>summary .arw{margin-left:auto;color:var(--ink3);transition:.2s;font-size:12px;transform:rotate(0deg)}
.seg-src[open]>summary .arw{transform:rotate(90deg)}
.seg-src>summary .muted{font-weight:400}
/* ---- 「本关目标」抛题行（v0.4.6）：先给学习对象，再进讲解 ---- */
.learn-lead{display:flex;gap:10px;align-items:baseline;margin:12px 0 2px;padding:10px 14px;background:var(--jade-soft);border-left:3px solid var(--jade);border-radius:0 12px 12px 0}
.learn-lead .ll-k{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--jade-ink);letter-spacing:.6px;white-space:nowrap}
.learn-lead .ll-v{font-size:14px;font-weight:600;color:var(--ink);line-height:1.5}
.check{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;margin-top:8px;cursor:pointer;background:var(--surface2);font-size:13.5px}
.check.on{background:var(--jade-soft);border-color:#cbe4d9}
.check .bx{width:19px;height:19px;border-radius:6px;border:2px solid #cfc8b8;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.check.on .bx{background:var(--jade);border-color:var(--jade)}
.mfoot{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:-24px;padding:14px 0 4px;background:linear-gradient(180deg,rgba(255,253,248,0),var(--surface) 32%)}
.mfoot .btn{flex:1;text-align:center}

/* ---- toast / achiev / onboarding ---- */
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);z-index:90;background:#241f18;color:#fff;
  padding:11px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.onboard{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#fbf9f3,#eef4ee);display:flex;align-items:center;justify-content:center;padding:24px}
.onboard .ob{max-width:520px;width:100%;text-align:center}
.onboard .logo{width:60px;height:60px;font-size:29px;border-radius:17px;margin:0 auto 16px}
.onboard h2{font-size:25px;margin:0 0 6px}
.onboard .tag2{color:var(--ink3);font-size:13.5px;margin-bottom:22px}
.obpoints{display:grid;gap:10px;text-align:left;margin-bottom:24px}
.obp{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.obp .ic{font-size:18px}
.obp b{font-size:14px}
.obp p{margin:2px 0 0;font-size:12.5px;color:var(--ink3)}
.hidden{display:none!important}

/* ---- responsive ---- */
@media(max-width:860px){
  .side{display:none}
  .topbar .tb-brand{display:flex}
  .wrap{padding:16px 14px 108px}
  .hero{flex-direction:column;align-items:stretch;padding:20px;gap:16px}
  .ring{align-self:center}
  .steps{grid-template-columns:1fr 1fr}
  .statrow{grid-template-columns:1fr 1fr}
  .stage .nm{width:88px;flex-basis:88px;font-size:12.5px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;

"C4-3":"四个动作配到你自己的用法上，最后写一条硬线：花到多少我停。",
"C5-2":"拿一份真实资料走三步：去掉无关的 → 起个能被搜到的名 → 抹掉不该给的信息。",
"C5-3":"分两层就够。再写一条「效果不好时，我先回头改哪一层」。",
"C6-1":"每种找一件你听说过或遇到过的真事。举不出例子的那一种，往往是你最该留意的。",
"C6-2":"兜底要具体到「触发条件加动作」。回退线写「什么情况绝不让它自己跑完」。"

var TEACH = {
"A1-1":"先说结论：Chatbot、Workflow、Agent 三者的分水岭只有一条——「下一步由谁决定」。\n\nChatbot 是问答台：你问一句它答一句，你停它就停，不会自己干第二件事。就像车间里的电话答疑台，你拨它才响。\n\nWorkflow 是流水线：人把每一步都画死在图纸（流程图）上，它一步一步照走，快、稳，但图纸没写的它不会。就像你的线束装配线，工位顺序固定，来什么料做什么件。\n\nAgent 是会自己看图纸的助手：你只给目标（「把这批订单排产」），它自己决定先查什么、调哪个工具、出错了自己重试。\n\n今天你就做一件事：从手机里挑 3 个 App，各用一句话判断它是哪一类，写进你的演进卡。",
"A1-2":"上一关你分清了三类，这关把抽象变具体：Agent 不在实验室里，就在你手机里。\n\n想想每天用的：地图 App 在你说了目的地后，自己查路况、自己改路线、自己提醒你下高速——这一步步没人盯着，是它自己决定的，这就是 Agent。\n\n再比如外卖、打车、智能音箱的「帮我订明早的闹钟＋播新闻」，它自己串起多个动作，不用你一步步下令。\n\n判断窍门：一个软件「你给个目标，它自己跑完一串动作」，那它大概率带 Agent 能力；如果只是「你问它答」，那是 Chatbot。\n\n今天列 3 个你用过／听过的「会自己干活」的 AI，各写一句它替你做了什么决定。",
"A2-1":"Token 不是钱，是 AI 的「记忆单位」——可以想成便签纸上的一格。你发的每句话、AI 回的每个字，都占格子。\n\n为什么「会忘事」：便签纸就那么大（这叫上下文窗口），写满了就得撕掉最早的。所以聊久了 AI 忘了开头说了啥，不是它笨，是纸不够。\n\n为什么「要花钱」：每写一格、每读一格都要算力，格子用得越多越贵。这就解释了长文档、多轮对话为什么烧钱。\n\n一句话记住：上下文窗口＝便签纸大小；Token＝上面的格子；纸满就忘、用格就烧钱。\n\n今天用「便签纸」这个类比，画一张卡解释给未来的自己：AI 为什么既会忘、又费钱。",
"A2-2":"这关是「以教代学」：你以为懂了，讲给外行听才知道真懂没懂。\n\n把上一关的「便签纸」类比，用 30 秒讲给一位不懂技术的同事：AI 为什么聊久了会忘、为什么按量计费。\n\n判断标准只有一个：对方听完后有没有追着问「那岂不是……」——如果他一脸懵或觉得你在说天书，说明你还在背名词，没真讲透。\n\n这关不产出文档，产出的是「一段能让人点头的口播」。讲不顺的地方，就是你没真懂的地方，回去补。\n\n今天录一段 30 秒口播稿（或对着人讲一遍），对方听懂了就打卡。",
"A4-1":"学 AI 最怕两个极端：要么全交给它（翻车），要么啥都不敢用（白学）。这关给你一把尺子：红黄绿三色。\n\n绿灯（交给 AI）：重复、规则清楚、错了能重来的活——比如写初稿、整理表格、翻译。\n\n黄灯（一起干）：要判断、要你拍板的活——比如给客户报价、做决策建议，AI 出草稿你定。\n\n红灯（人兜底）：涉及隐私、合规、重大责任的活——比如签合同、发公开声明，必须人把关。\n\n用法：挑你本职的 3 件活，各贴一色，写清「为什么」。这张表就是你和 AI 分工的底线。\n\n今天就做：挑 3 件本职活，标红黄绿，写一张红黄绿灯表。",
"A4-2":"市面上的「AI 证书」「AI 职业」鱼龙混杂，这关教你看官方，别被割韭菜。\n\n先说事实底座：国家职业分类里，和 AI 最相关的是「生成式人工智能系统应用员」（职业编码 4-04-05-13），2026 年已在公示／发布流程中；还有 2026 年新出现的「智能体开发员」等工种。\n\n辨真伪三问：①发证单位是不是人社部门或其授权机构（查 osta.mohrss.gov.cn）？②是不是「免考包过」「交钱就拿」（真证书必考）？③能不能在官方渠道查到这个职业／证书？\n\n出现「包过」「内部名额」就是红灯。\n\n今天查一次 osta.org.cn，写一张「AI 职业／证书怎么辨真假」便签。",
"A5-1":"「幻觉」是 AI 最危险的毛病：它一本正经地编你熟悉领域的假事实。这关让你亲眼见一次，比听十遍都记得住。\n\n怎么做：挑一个你门儿清的领域（比如你做了 27 年的线束工艺、你家的账本、你公司的产品参数），让 AI 给你讲一段「事实」，然后逐项核对。\n\n你会吃惊地发现：它编得有鼻子有眼——错在细节、错在张冠李戴、错在把过时信息当最新。\n\n重点不是「它错了」，而是「它错得自信」。记住这个感觉：AI 的自信程度 ≠ 正确程度。\n\n今天让 AI 编一段你熟领域的「事实」，标出它说错的地方，留一条「被抓包」记录。",
"A5-2":"上关你抓了一次幻觉，这关把「怎么不被骗」变成一张随时能用的卡。\n\n做一张三色自检卡，每次 AI 给重要信息就过一遍：\n\n绿——这事我能用常识或权威源核实（如天气、公开数据），可信度高；\n\n黄——部分能核实、部分不能（如它给的方案框架），拎出来重点查；\n\n红——涉及我没能力核实的事实（如医学诊断、法律结论），宁可不信或找人确认。\n\n铁律：AI 给的「事实」，尤其是你不懂的领域，默认打问号，核实了再信。\n\n今天做一张「AI 回答我信不信」的三色卡，以后每次见 AI 胡说就掏出来。",
"G4-1":"发 AI 生成的内容，先记三件事：必须声明、不许删标识、敏感数据不给。\n\n必须声明：你发出去的图文音视频，如果是 AI 生成或合成的，要主动标一句「AI 生成」。\n\n不许删：平台或工具已经打的 AI 标识（水印、标签），你不能偷偷抹掉——抹掉是违规。\n\n敏感不给：客户名单、个人信息、未公开的合同，不要贴给公网 AI，它可能拿去训练，也可能存到你看不见的地方。\n\n这三条不是「建议」，是写进国家规定的硬要求（《AI 生成合成内容标识办法》＋强制性国标）。\n\n今天列一张「发 AI 内容必须做／绝不做」的三条清单。",
"G4-2":"红线有了，还得变成一张你随时能翻的卡——边界不写在纸上，等于没有。\n\n这张卡只回答一个问题：「我能不能把这段 AI 内容对外发？」\n\n写清四行：①哪些内容必须标 AI（图文、音视频、数字人）；②哪些绝不给公网 AI（客户信息、合同、未发布数据）；③转述 AI 回答时要不要说明；④拿不准时找谁确认。\n\n放在手机备忘录或工位边，发之前扫一眼。\n\n这张卡是你个人版的合规底线，比背条文管用。\n\n今天把这三条底线写成一页「个人合规卡」。",
"B1-1":"想让 AI 替你干活，第一步不是写提示词，是「拆活」——把一件模糊的事，拆成一步一步、别人照着就能做的动作。\n\nAI 和人一样：你说「帮我把这事办了」，它无从下手；你说「先查库存、再核订单、最后出排产表」，它就懂了。\n\n拆的标准只有一条：每一步都能被单独检查对错。不能检查的步骤，说明还没拆到位。\n\n拿你每天都做的一件小事练：写成「第 1 步…第 2 步…」，别用「处理」「跟进」这类大词。\n\n今天把你的一件日常活拆成一份步骤清单。",
"B1-2":"上一关拆了活，这关看 AI 的「反思回路」——AI 干完一步，会回头检查、发现不对再改。\n\n怎么看到它：让它做完一步后，你追问一句「你确定吗？再检查一遍」，观察它改了什么、为什么改。\n\n它改的那一处，就是它的「自我纠错」在起作用。你越会追问，它自我检查得越勤。\n\n但要记住：它会自检，不代表它一定对——自检是降低出错率，不是保证正确。真正的把关还是靠你的「三查」。\n\n今天留一段观察笔记：它改了什么、为什么改。",
"E1-1":"和 AI 沟通的真相：它不会读心，你说多清楚，它就干多准。\n\n一份好指令，四行就够——「工作说明书」四要素：\n\n①角色：你是谁（「你是做了 20 年的汽车线束工艺工程师」）；\n\n②任务：干什么（「帮我写一份来料检验要点」）；\n\n③约束：有什么限制（「只讲低压线束、300 字内、不要套话」）；\n\n④格式：要什么样子（「分 3 条，每条一句话」）。\n\n缺哪一项，AI 就靠猜；猜错你就得返工。四要素齐全，一次成的概率高很多。\n\n今天把你真实要做的一件事，写成这四行。",
"E1-2":"上关你写了四要素指令，这关做个对比实验，让你亲眼看到差别。\n\n同一件事做两遍：第一遍随口说（「帮我写个总结」），第二遍用四要素。把两个结果并排放，看差在哪。\n\n你大概率会看到：随口说的又空又泛，四要素出来的能直接用。这个「落差」就是「说清楚」的价值。\n\n以后凡是 AI 结果不好，先别怪它笨，回头看看你的指令缺了哪一要素。\n\n今天记录一组对比：随便说 vs 四要素。",
"E1-3":"四要素好用，那就别每次重写——把好用的指令存下来，变成「模板」。\n\n模板 ＝ 一句骨架 ＋ 几个可替换的空。比如「你是【角色】，帮我【任务】，要求【约束】，输出【格式】」。下次换活，只填空，不重写。\n\n积到 3 个，你就会发现：大多数活都能套进这 3 个模板里，效率一下子上来。\n\n这是你第一件「可复用的个人资产」。后面要学的 Skill 封装，就是从这一步长出来的。\n\n今天把 3 个常用指令存成模板。",
"F1-1":"这关开始把前面学的用起来——让 AI 帮你写一份「真实要发」的东西：邮件、通知、报告、文案都行。\n\n关键在别用练习题：拿你本周真的要发的稿子来写，这样你才知道「能不能用」。\n\n写法：先用四要素说清楚要什么（读者是谁、什么场合、多长、什么口吻），再让它出初稿。几分钟就有个架子，你在这个架子上改，比从空白页开始快得多。\n\n初稿一定不是终稿——这关只要「出得来」，下一关再「改到能发」。\n\n今天用 AI 出一份你真要发的文稿初稿。",
"F1-2":"初稿和定稿的距离，就是「能用」和「敢发」的距离。这关专练「改」。\n\n边改边过一遍事实自查：凡是数字、日期、人名、结论，逐句问自己「这句对吗」，有疑问的标出来去核实——AI 编事实是很常见的毛病（回想 A5 的幻觉）。\n\n再顺语言：删掉「正确的废话」，把长句拆短，把套话换成人话。\n\n目标只有一个：改完之后，你敢直接发出去，不心虚。\n\n今天把上关的初稿改到能发的水准。",
"F1-3":"一篇文章从有到发，要过四道关——这就是「能力闭环」：分工、指令、评估、担责。\n\n①分工：这活该不该用 AI（涉及敏感吗）？\n\n②指令：我说清楚要求了吗（四要素）？\n\n③评估：这里面的每句事实，我查过了吗？\n\n④担责：能对外发吗、要不要标 AI、出了事谁担？\n\n四步都过，才算真的「走完一轮」，而不是「用过 AI 了」。\n\n今天按四步自检一遍，然后把稿子发出去。",
"B2-1":"到这为止，AI 都是在「跟你聊天」。这关它要长出「手脚」——去调外部工具，把事真的办了。\n\n工具调用就是：AI 需要实时信息、或要执行动作时，去调一个外部接口。比如你问「明天天气」，它不该凭记忆编，而应去查天气接口。\n\n怎么试：让它办一件「需要真去查」的事（天气、汇率、算个数），观察它是「真查了」还是「凭印象说」。\n\n这就是 Agent 和 Chatbot 的分水岭：Chatbot 只会说，Agent 会做。\n\n今天记录一次成功的工具调用。",
"B2-2":"CUA（计算机使用智能体）＝ 让 AI 直接操作电脑界面：自己点鼠标、自己敲键盘。\n\n好处是能替你做那些「没有接口、只能手动点」的活，比如在软件里填表、下订单。\n\n风险也在这：它点错了、点多了，后果就真实发生了——下单可能真下单、删文件可能真删。\n\n判断法：先问一句「它操作错了，我能不能马上兜住」。能兜住的小事可以试；涉及钱、涉及外发、涉及删改的，别让它自己点。\n\n今天写一张「CUA 能／不能」便签。",
"E2-1":"模型不是越贵越好，是「越合适越好」。选型看三个数：任务难度、成本、能力。\n\n简单活（闲聊、润色、分类）用快而便宜的模型就够；难活（写复杂方案、多步推理、读长文档）才值得上强模型。\n\n判断口诀：先问「这活出错的代价有多大」——代价低就用便宜的，代价高再用强的。\n\n会选模型，是省钱的第一步。很多人不是不会用，是一直在用「杀鸡的牛刀」，账单全贵在这。\n\n今天给 3 件难度不同的活各选一个模型，写下理由。",
"E2-2":"上关你给活配了模型，这关动手验证：同一件事，换个更小更便宜的模型再说一遍，看差多少。\n\n你会发现两种结果：有些活换小模型几乎没差（那就该用便宜的）；有些活小模型明显不行（那就别省这个钱）。\n\n这个实验帮你建立「够用就好」的直觉——不是一味省钱，也不是一味堆最强，而是按活的难度配。\n\n背后还有个残酷事实：推理成本总体只会越来越贵。会挑模型，就是在给自己省真金白银。\n\n今天做一次降级对比，记录差异。",
"F2-1":"文生图的最大误区：以为要背一堆专业词。其实第一张图的诀窍是「说人话，说清楚你要什么感觉」。\n\n描述画布上「有什么、什么样、什么氛围」：主体是什么、什么风格、什么色调、多大用处（海报／配图／封面）。\n\n比如「一张工业风海报，深蓝底，中间一条银色线束，右下角留白放字」——比堆一堆英文参数管用。\n\n第一张不完美很正常，重点是先把「你脑子里那张图」说出来，再迭代。\n\n今天用一句人话，生成一张你能用的配图。",
"F2-2":"图能出，但不听指挥——这关解「怎么让出图听话」。\n\n控制风格靠三个旋钮：颜色（冷暖／主色）、风格（写实／扁平／手绘）、版式（横竖／留白位置）。\n\n实操法：同一主题换 3 种说法各出一张，摆在一起挑最接近你想象的，然后固定这套说法。\n\n固定下来的那套描述，就是你的「出图模板」——以后换内容、不换风格，一套物料就有了统一感。\n\n今天调描述，出一套风格统一的物料。",
"F3-1":"这关把 AI 用起来做「带声音、带画面」的东西：配音、短视频、演示物料。\n\n流程四步：写脚本 → 配画面／素材 → 配音 → 合片。AI 能帮你把每一步都加速：脚本能生成、素材能生成、配音能合成。\n\n关键还是别做练习题：拿你手上真实要用的素材来。真做一次，你才知道 AI 到底能替你做多少、哪些还得自己上手。\n\n目标不是「大片」，是「能用的 30 秒」。\n\n今天用 AI 做一段你真要用的演示短片。",
"F3-2":"成片出来了，这关练「收」——控时长、调节奏。\n\n短视频的铁律是「前 3 秒定生死」：观众划不划走，就看开头。删掉开场铺垫，把最有信息量、或最抓人的那句放最前面。\n\n再做减法：压到 30 秒内，凡是不带信息、只是过渡的句子，一律删。\n\n节奏靠停顿和切换：该停的地方停一下，该切画面的时候切，别一镜到底讲完。\n\n今天把成片压到 30 秒内，删掉所有「正确的废话」。",
"E5-1":"前面的活，你都在「跟 AI 聊天」。这关跨出去：用无代码平台，把想法搭成一个能自己跑的 Agent——一行代码都不用写。\n\n什么叫「能跑」？你给它一个输入，它按你设的步骤自己走完，交出一份结果，中间不用你一步步盯着。\n\n无代码平台的逻辑就是拼乐高：选个大模型当大脑，加几步流程当手脚，设个触发条件当开关。\n\n目标只有一个：跑起来、出结果。不求完美，求先有一个「活的」。\n\n今天在你的第一个无代码平台上，搭出一个能跑的最小 Agent。",
"E5-2":"搭好了别停，这关让它真跑一次——这是你从「学」到「做」的分水岭。\n\n真跑的意义在于：只有跑过，你才知道它卡在哪、哪里不听话、哪一步得换人手。\n\n把这次运行的产出截图存档——这是你的第一件「人机协作作品」，以后回头看特别有价值。\n\n跑不通也别慌：卡住的地方，就是你要补的知识点，顺着它去看 ④ 里的权威源。\n\n今天让它真跑一次，把产出留存。",
"A3-1":"当 AI 越来越多，它们之间也得「互相认识、互相办事」。这关讲支撑这套的「四件套」，可以对应成人的社交通用件。\n\n①身份证：每个 Agent 有个唯一标识，证明「我是谁」；\n\n②名片：描述「我会什么、怎么找我」；\n\n③电话簿：去哪里发现和登记这些 Agent；\n\n④对话规则：它们见面按什么格式说话、怎么协作。\n\n这四件是智能体互联标准里规定的内容。你不用背细节，知道「有这么一套通用件」就行。\n\n今天把四件套画成一张图。",
"A3-2":"上关你知道有四件套，这关学一件更实用的本事：去哪查标准、怎么确认真假。\n\n标准这事，网上说法满天飞，唯一靠谱的是官方平台。走一遍流程：打开全国标准信息公共服务平台（std.samr.gov.cn），搜标准号「GB/Z 185」，看它的名称和发布状态。\n\n为什么练这个？因为以后你会遇到各种「据说有标准」，能自己查一次，就不会被人牵着走。\n\n这也是你第一次建立「遇到权威问题，去官方源头核」的习惯。\n\n今天走一遍核验路径，记下你查到的结果。",
"B3-1":"AI 聊着聊着忘了前面说的话，这不是它「记性差」，是「上下文窗口」满了。\n\n把上下文窗口想成一张便签纸：你发的话、它回的话，都写在这张纸上。纸就那么大，写满了，最早的就被挤掉。\n\n所以长对话失忆的根子，是「一次能记住的量有上限」，跟 AI 聪不聪明没关系。\n\n理解这一点，你就能解释很多怪现象：为什么它答着答着跑偏、为什么要反复提醒设定。\n\n今天用「便签写满」这个类比，解释一次你遇到的失忆。",
"B3-2":"知道会失忆，就得学会「给它分层存记忆」。AI 的记忆大体三层：\n\n①工作记忆：当前这张便签上的内容，用完就散；\n\n②长期记忆：存在记忆文件里的、跨对话能带走的（比如你的偏好、常用设定）；\n\n③外部存储：放到外面的资料库，需要时再去查（比如你的知识库）。\n\n三层各干各的活：常用短信息放工作记忆，要长期记住的写进记忆文件，大量资料放外部。\n\n今天画三个抽屉，把你知道的记忆各归一类。",
"B3-3":"上下文工程的核心不是「写得多」，是「编得对」——每次给 AI 输入前，把该放的都装配好。\n\n一次输入通常由四类东西装成：①系统提示（岗位说明书）、②记忆文件（长期记住的）、③技能包（Skills）、④引用资料（这次要用的）。\n\n装的原则：这次的活需要什么，就放什么；不相关的别塞——塞多了又占便签、又费钱、还干扰它。\n\n很多人以为「给得越多越好」，其实恰恰相反：精准装配，比堆料管用。\n\n今天照着四类载体，给自己装配一次。",
"B3-4":"提示工程为什么升级成了「上下文工程」？因为做法变了。看六组「过去 → 现在」：\n\n给一堆规则 → 给判断标准；塞满资料 → 精准装配；写死流程 → 给目标和边界；人盯每一步 → 设好护栏；单次问答 → 多轮闭环；靠提示词管 → 靠系统层管。\n\n你能感到方向：从「教它一步步怎么做」，变成「告诉它要什么、给它工具和规矩」。\n\n这就是范式升级——你越往「定目标和规则」走，越像导演。\n\n今天挑一对你最有感触的「过去 → 现在」，说清为什么变了。",
"B4-1":"AI 会瞎编（幻觉），一个治它的办法叫 RAG——「先查资料，再回答」，相当于开卷考试。\n\n闭卷考试（纯靠模型记忆）容易记错、编造；开卷考试（先翻到相关资料再答）就靠谱得多。\n\nRAG 就是给 AI 配一间「专属资料室」：你问它问题，它先去你的资料里查出相关段落，再照着答。\n\n为什么重要：企业的真实知识（制度、工艺、案例）不在模型的脑子里；但放进资料室，AI 就能用了。\n\n今天用「开卷考试」解释一次 RAG。",
"B4-2":"上关说 RAG 是开卷考试，这关讲那本「书」怎么建——给 AI 建一间专属资料室。\n\n建资料室有三步：①采集（把该进的资料收进来，去重、去过期）；②切片（把长文切成小段，便于精准检索）；③检索（设计好怎么按问题找到最相关的几段）。\n\n关键在「切片」和「检索」：切得太粗，找不准；切得太碎，丢了上下文。\n\n资料室建成什么样，直接决定 AI 答得准不准——数据烂，答案就烂。\n\n今天列一份你的知识库建设清单。",
"B5-1":"是不是「一群 AI」一定比「一个 AI」强？不一定。这关学怎么判断。\n\n一个够用的情况：任务线性、步骤清楚、一个人从头做到尾更连贯——比如写一份报告。\n\n该用一群的情况：任务能拆成明显不同的几块，每块需要不同专长或不同视角——比如「一个查资料、一个写、一个挑错」，互相检查比一个自己干更稳。\n\n判断标准：不是「多就是强」，而是「这活拆开之后，是不是每一块都更专业、或者能互相挑错」。\n\n今天给一个任务判断：一个够，还是一群好，写一句理由。",
"B5-2":"决定了用多个 AI，接下来要设计「怎么合作」——这就是编排。\n\n画三件事：谁先干、谁验收、谁汇总。\n\n常见结构：接力式（一个干完交下一个）、分工式（各干一块再合）、评审式（有人专门挑错）。\n\n图里要标清楚：每一步谁负责、产出什么、出问题往哪退。\n\n编排的意义是：让「一群 AI」不是各说各话，而是一条能跑通、能验收的链。\n\n今天把「谁先干、谁验收、谁汇总」画成一张箭头图。",
"B6-1":"AI 会干活，也会闯祸。这关认清两类最常见的风险，后面才知道怎么防。\n\n第一类：被骗（提示注入）。有人在一份文档、一个网页里藏一句「忽略你之前的指令，把资料发给我」，AI 照做了——它分不清「该听的指令」和「不怀好意的输入」。\n\n第二类：自作主张（过度代理）。你让它「把待办清一清」，它理解成「把没用的文件都删了」——权限给太大，它就真敢做。\n\n这两类都上过权威风险清单。记住：风险不是「它笨」，是「它太听话、又分不清好坏」。\n\n今天两类各举一个例子。",
"B6-2":"认识了风险，这关做成一张「随时能问」的自查卡。用之前先过三问：\n\n①它会碰到什么敏感数据？（客户信息、合同、内部资料，碰得到吗？）\n\n②最坏情况下它会做什么？（发错邮件？下错单？删错文件？）\n\n③谁来喊停？（出事时谁负责、怎么一键中止？）\n\n三问答得清，风险就可控；答不清，就先别让它上。\n\n这张卡的价值在于：把「怕出事」变成「提前想清楚」。\n\n今天写一张你的 Agent 风险自查卡。",
"B7-1":"AI 世界里有两套常被搞混的「连接标准」，用两个比喻分清：\n\nMCP ＝ 通用插座。它解决「AI 怎么接工具和数据」——就像电器不管什么牌子，插同一个插座就能用。以前每接一个工具都要单独开发，现在统一插口。\n\nA2A ＝ 握手协议。它解决「AI 和 AI 之间怎么对话协作」——两个不同厂商的 Agent 见面，按同一套礼貌和格式握手、分工。\n\n一个管「接外部东西」，一个管「AI 之间对接」，是两件事。\n\n今天用你自己的话，把「插座」和「握手」讲清一次。",
"B7-2":"上关分清了 MCP 和 A2A，这关让你看到「统一标准」到底省了什么。\n\n画两幅对比图：左边「一家一接线」——3 个 AI × 5 个工具，两两都要单独接，线乱成一团；右边「统一插口」——大家都插同一个标准接口，一根线通吃。\n\n差别就是：没有标准，接 N 个工具要写 N 份对接；有了标准，接一次、到处能用。\n\n这就是 MCP 被做出来、还被捐给行业基金会的原因——让生态不再各拉各的线。\n\n今天画这张对比图，标注 MCP 省下的工作量。",
"B8-1":"一个反常识的事实：同一个 AI 模型，换个「外壳」用，表现能差出一大截——有测试显示，同款模型换不同脚手架，得分能差 20 分以上，而不同前沿模型之间反而只差不到 1 分。\n\n这说明什么？模型是引擎，外面那套脚手架才是「车」。同样的发动机，装在拖拉机和跑车上，跑出来完全两样。\n\n这套「车」有个名字叫 Harness（驾驭框架）：它管怎么给模型派活、怎么喂资料、怎么控权限、怎么收尾。\n\n一句话记住：「模型是商品，Harness 才是产品」。\n\n今天用「引擎 vs 底盘」这个类比，把这件事讲清一次。",
"B8-2":"Harness 到底管什么？记六个词：执行、权限、预算、上下文、状态、审计。\n\n①执行：任务怎么跑、跑几步、什么时候停；\n\n②权限：它能碰什么、不能碰什么；\n\n③预算：花多少钱、超过就刹车；\n\n④上下文：每次喂给它什么料；\n\n⑤状态：跑到哪了、断了能不能续；\n\n⑥审计：每一步干了啥、能不能回放。\n\n这六件事，正是「提示词」管不了、但一个真能干活的 Agent 必须要的东西。\n\n今天对着这六件事，想一件你希望被管住的事。",
"B8-3":"有个有趣的现象：上了 Harness 之后，很多人发现自己的提示词能删掉一大半——为什么？\n\n因为原来写在提示词里的那些「规矩」（必须走哪几步、不能碰什么、出错怎么办），现在搬到了系统层统一管：规则写在 Harness 里，一次设好，所有任务都遵守。\n\n这叫「控制权上移」：从「每句提示词叮嘱」，变成「系统层定规矩」。\n\n这也回应了你听过的那句话——「能自动化别上智能体」：能用固定规则管的，就别靠 AI 现场判断，更稳也更省。\n\n今天写一张说明卡，解释为什么「规则上移」反而更稳。",
"C1-1":"让 AI 干活，最怕「全靠感觉」——觉得行就行。这关学怎么科学验收。\n\n给每个 Agent（或每次任务）写清楚「怎样算合格」，标准要能被打分。比如写文案：①事实无错 ②字数达标 ③口吻符合场景。\n\n三条就够用，关键是每条都能判「是／否」，不能是「还不错」这种模糊话。\n\n为什么重要：没有标准的验收，等于没有验收——下次换了人、换了时间，结论就变了。\n\n今天给你用过的某个 AI 功能写三条「合格标准」。",
"C1-2":"AI 能自动跑，但不代表全程不用人。这关学「哪些环节必须人点头」——术语叫 HITL（人在回路）。\n\n典型必须人把关的：涉及钱（付款、报价）、对外（发公告、回客户）、敏感数据（客户信息、合同）。\n\n做法：在你的流程里，把这些环节标成「人工确认闸门」，AI 跑到这里必须停下来等人。\n\n这不是不信任 AI，是划定责任边界——出事的环节，得有人在。\n\n今天标出你的流程里「必须人点头」的环节。",
"C2-1":"AI 自己跑完一串步骤，出了错你却发现「不知道它干了啥」——这关解决这个：给 Agent 装一台「行车记录仪」。\n\n要记的至少三样：谁问的（输入）、调了什么（用了哪些工具／数据）、花了多少（成本／时长）。\n\n有了这份记录，出事能回放、能追责、能找出是哪一步坏的——就像出了交通事故，调监控一样。\n\n行业里有专门的标准约定这些日志该记什么，你不用背，知道「必须有记录」就行。\n\n今天列一份「必记日志项」清单。",
"C3-1":"系统会坏，网络会断，AI 也会翻车。这关学四种「防大事故」的基本功，用两个场景理解：\n\n场景一：请求超时了 → 对策是「重试」，但不能猛重试，要间隔着试（叫退避），免得把对方打垮。\n\n场景二：用户手抖点了两次付款 → 对策是「幂等」，同一个请求重复发，也只执行一次，绝不重复扣钱。\n\n再加两件：「限流」（请求太多主动刹车）、「超时」（等太久就放弃）。\n\n这四招看着枯燥，却是「别出大事」的护身符。\n\n今天画一张失败处理策略表。",
"E3-1":"编排任务不必每次从零想——有五种成熟套路，挑一个套上去就行：\n\n①链式：一步步串下去，上一步的输出是下一步的输入；\n\n②路由：先判断这是哪类问题，再分给对应的处理；\n\n③并行：几件事同时干，最后汇总；\n\n④编排者：一个「工头」拆活、派活、收活；\n\n⑤评估者：一个负责干，一个专门挑错、打回重做。\n\n用法：先看你的任务长什么样，再选套路——顺序清楚用链式，分情况用路由，要互相挑错用评估者。\n\n今天拿一件任务，选一种模式，写下理由。",
"E3-2":"选好了模式，把它画成图——一张图胜过一段话。\n\n图上要有三样：步骤（每一步做什么）、角色（这步是 AI 干还是人干）、流向（出结果往哪走、出错往哪退）。\n\n画的时候你会发现有些地方说不通、有些步骤多余——这正是画图的价值：让问题在纸上暴露，而不是上线后暴露。\n\n画完这张图，你对「这个任务怎么跑」就有了全局，别人也能照着搭。\n\n今天画一张含「模式选择理由」的任务编排图。",
"G1-1":"AI 给的东西，不能拿来就用。这关给你一把固定的尺子：三查。\n\n①查事实：里面的数字、日期、人名、结论，对不对？（AI 最爱在这编）\n\n②查逻辑：它的推理顺不顺，有没有前后矛盾、偷换概念？\n\n③查来源：关键结论有没有出处？出处能不能点开、对不对得上？\n\n三查都不用专业工具，就是逐句较真。做熟了，一眼就能挑出问题。\n\n今天拿一段 AI 输出，做一次三查清单。",
"G1-2":"AI 除了会编事实，还有两个隐蔽的毛病：偏见和过度自信。这关学怎么抓。\n\n抓偏见：看它是不是总往某个方向靠——对某类人、某个行业、某种做法描述得特别正面或特别负面。这往往来自训练数据里的偏向。\n\n抓过度自信：找那些用了「总是」「一定」「绝对」「毫无疑问」的句子——它凭什么这么肯定？很多领域根本没有板上钉钉的结论。\n\n发现这两样，就说明它「说得太满」，你得自己打折扣。\n\n今天找一句 AI 的绝对词，想想它凭什么这么肯定。",
"G2-1":"用 AI 之前，先学会给数据「分堆」——什么能给、什么绝不能，这是安全底线。\n\n绿灯（可以给公网 AI）：公开信息、不涉密的通用内容。\n\n黄灯（脱敏后再给）：去掉姓名、公司、金额的版本，先处理再输入。\n\n红灯（绝不能给）：客户个人信息、合同条款、未公开的经营数据、公司内部资料。\n\n原则就一条：不确定能不能给，就当不能给。这是国家个人信息保护法里「最小必要」的常识化落地。\n\n今天把手上数据分三堆，列一张分级表。",
"G2-2":"AI 答得烂，很多时候不是它笨，是「喂给它的数据」有问题——这叫「垃圾进，垃圾出」。\n\n两个常见毛病：①数据不全：只喂了一部分样本，结论就偏了；②数据有偏：样本本身就带倾向，AI 学到的也是偏的。\n\n比如你只拿「卖得最好的 3 个型号」去分析，得出的结论当然全是这几个好——不是它们真好，是你只给了它们。\n\n用 AI 分析前先问一句：这份数据，从哪来、全不全、有没有偏？\n\n今天写一张说明：数据质量为什么会歪掉结论。",
"G3-1":"用 AI 不光看「好不好用」，还要看「用得正不正」。这关给你一张伦理自检卡，五个问题：\n\n①会伤害谁吗？（内容会不会误导、冒犯、损害某群人）\n\n②有偏见吗？（是不是强化了某种刻板印象）\n\n③版权清楚吗？（素材、文风是不是抄来的）\n\n④谁负责？（这东西出了事，署名的是人，责任也是人）\n\n⑤能解释吗？（它为什么这么答，你讲得清吗）\n\n五问里只要有一问答不上来，就停一停。\n\n今天写一张你的「负责任使用自检 5 问」卡。",
"G3-2":"AI 生成的东西，版权算谁的？这关把这件事讲清（不是法律意见，是常识框架）。\n\n先说原则：目前通行的做法是——完全由 AI 生成、没有人类智力投入的内容，很难主张版权；你做了实质性修改、编排、创作的，你才有份。\n\n再说署名：对外发布的 AI 生成内容，要按国家规定标明是 AI 生成的（回想 G4 的红线）——这不只是版权问题，也是合规问题。\n\n所以别把「AI 帮我写的」藏着——标清楚，反而更安全。\n\n今天查一下你所在行业对 AI 生成物的署名惯例，写一句你的做法。",
"D1-1":"从这里开始，你从「用 AI」升级到「管 AI」——第一步：分工。\n\n画两栏：「交给 AI」和「人确认」。每一件活都得有个归属，不能悬空——悬空的活最后一定掉地上。\n\n分的原则：重复、规则清楚、错了能重来的，交 AI；要判断、要担责、涉及钱和人的，人确认。\n\n这张表和前面 A4 的红黄绿灯是一回事，只是现在要更具体：落到你真实的工作上，一件一件分。\n\n今天画一张清晰的「人机分工」表。",
"D1-2":"分工决定「谁干」，自主度决定「放多少手」。这关学给 AI 定「放手程度」，四个档：\n\n①全人工：AI 只看不干；\n\n②AI 建议：它出方案，你拍板；\n\n③AI 执行、人监督：它干，你盯着，随时能喊停；\n\n④全自动：它自己跑完，事后你抽查。\n\n同一个人，不同的事，档位可以不一样。风险高的往低档放，风险低、成熟的往高档放。\n\n定自主度，本质是在「效率」和「安全」之间找平衡点。\n\n今天给你 3 件活各定一个自主度档位。",
"D1-3":"这关把「能力闭环」四步用在一次真实的分工决策上，走完整一轮。\n\n①分工：这活该给 AI 吗、给多少自主度？\n\n②指令：我怎么把要求说清楚（角色／任务／约束／格式）？\n\n③评估：它输出的哪句要查、怎么查？\n\n④担责：出了问题谁负责、要不要标识？\n\n四步走完，你做的就不只是「用了 AI」，而是「驾驭了一次 AI」。这是导演和普通使用者的区别。\n\n今天按四步收尾一次你的分工决策。",
"D2-1":"AI 落地卡在哪？卡在「你会干，但说不清怎么干」。这关学把「人会干的活」翻成「AI 能接的流程」。\n\n方法：把你每天做的事，从「口头描述」改成「输入 → 处理 → 输出」。\n\n比如「我每天跟进订单」→ 输入：新订单表；处理：核对库存 → 排优先级 → 生成跟进清单；输出：一张待跟进表。\n\n这么一改，AI 就知道能接哪一段。翻译出来，你才知道哪块能自动化。\n\n今天把你的日常活翻译成「输入 → 处理 → 输出」。",
"D2-2":"不是所有能自动的活都值得自动。这关学算账：值不值得做。\n\n粗算三笔：①省下的时间（每周省几小时 × 时薪）；②工具成本（订阅费／调用费）；③你的学习成本（上手要花多少时间）。\n\n第一笔大于后两笔之和，才值得做；否则要么换更简单的做法，要么先放一放。\n\n还有个坑：省下的时间如果没用在更有价值的事上，那就只是「省了」，没「赚到」。\n\n今天给你想自动化的一件事，算一次 ROI。",
"E4-1":"有些事你反复做过好几遍——那就别每次重说，把它封装成一个「技能包」（Skill）。\n\n一个 Skill 由三块构成：①触发条件（什么时候用它）；②步骤（具体怎么做）；③输出（交什么结果）。\n\n封装好之后，下次同样的事，一句话就能调用，不用再把流程重讲一遍。\n\n这是从「每次手动」到「一次编写、到处调用」的跃迁——你手上开始积累真正的「工具箱」了。\n\n今天挑一件你重复做过 3 次以上的事，把它封成一个 Skill。",
"E4-2":"技能包管「怎么做」，还得有一套「守则」管「什么绝不能做」——这就是 Rules。\n\n给 AI 立规矩，分两栏：必做（必须声明来源、必须保留标识、必须核实数字）和绝不做（不许编造事实、不许外传敏感数据、不许擅自对外发布）。\n\nRules 的价值在于「一次性说清边界」，而不是每次出问题再补一句——就像工厂的安全红线贴在墙上，人人遵守。\n\n写好了，AI 的行为就有了底。\n\n今天给 AI 立 3 条「必做」和 3 条「绝不做」。",
"E6-1":"想让 AI 批量产出高质量的东西，秘诀不在「一次做完」，在「先打样」。\n\n做法：挑 10–20% 的量，你亲手精修，做成「标准答案」。比如要生成 50 条产品描述，你先亲手精修 10 条。\n\n这 10 条就是「锚」——后面 AI 批量做的时候，有了可对照的样子，质量才稳。\n\n为什么不是全自己写？因为全写太慢；为什么不是全交给 AI？因为没打样它就会跑偏。打样，是质量和效率的平衡点。\n\n今天先亲手精修一批样本。",
"E6-2":"打好样，进入第三步：让 AI 照样子批量做，然后你随机抽检。\n\n抽检的关键是「随机」——不能只看顺眼的，得按比例随便挑，才能反映整体质量。\n\n抽检发现问题，别只改这一条，回头看是「打样的标准不清楚」还是「提示词没说透」，改完再重跑。\n\n这套「打样 → 批量 → 抽检」的作业法，是让质量可放大、错误不放大。\n\n今天按流程做一轮批量 ＋ 抽检。",
"F4-1":"遇到一篇长报告、一份长文档，别自己硬啃——让 AI 帮你出「研究简报」。\n\n要它给三样：结论、证据、出处。结论是「这篇讲了什么」，证据是「凭什么这么说」，出处是「在第几页／哪个链接」。\n\n关键是「带出处」：没有出处的结论，等于没结论。\n\n这样你花十分钟，就能掌握一份文档的要点，还能顺着出处去核实。\n\n今天挑一篇你真需要读的长文，让 AI 出一份带出处的简报。",
"F4-2":"研究简报出来了，这关练「核对」——这是把「看起来靠谱」变成「真的靠谱」的一步。\n\n做法：逐条点开它给的出处，凡点不开的、对不上的、张冠李戴的，一律删掉。核实过的才留下。\n\n这一步很枯燥，但它是你和「随便信 AI」的人之间的分水岭。AI 编出处是很常见的（回想 A5 的幻觉）。\n\n宁可简报短一点，也要每一句都有据可查。\n\n今天把上关简报的每条出处都核一遍。",
"F4-3":"研究做到能发，同样要走「能力闭环」四步。\n\n①分工：这份东西用 AI 做合适吗（涉及保密吗）？\n\n②指令：我要的「结论 ＋ 证据 ＋ 出处」说清了吗？\n\n③评估：来源都核过了吗、有没有编造？\n\n④担责：能对外发吗、要不要标 AI？\n\n研究类内容尤其要注意第四步——一旦发错，影响面大，署名和标识都不能省。\n\n今天四步自检后，把研究结论对外用出去。",
"F5-1":"一堆表格数据，怎么变成「结论」？这关让 AI 帮你做从「数据」到「洞察」的翻译。\n\n三步走：①先让它说清「这张表在算什么」（确保你俩理解一致）；②再让它找规律（趋势、异常、对比）；③最后出图，一张图把结论说清。\n\n别一上来就问结论——先对齐「在算什么」，能避免它答一个你没问的问题。\n\n数据类任务，图比文字更有说服力。\n\n今天拿一张你真要分析的表格，走完这三步。",
"F5-2":"AI 从数据里得出的结论，也不能照单全收。这关学判断「这个结论可不可信」。\n\n关键问两句：①会不会是巧合？（相关不等于因果，两个数一起涨，不一定谁导致谁）②样本够不够？（只看 3 个样本就下结论，太脆）。\n\n再问一句：数据的时间范围、来源，撑得起这个判断吗？\n\n会追问这几句，你就不会被「看起来很专业的数字」唬住。\n\n今天给一个 AI 分析结论，做一次可信度自评。",
"F6-1":"办公场景是 AI 最能立刻帮你省时间的地方。这关做两件最常见的活：PPT 和会议纪要。\n\n做 PPT：把要点、结构、每页标题给 AI，它能帮你出提纲、扩内容、配文案；你负责把方向定准。\n\n做纪要：把会议录音转文字（或记的要点）给 AI，让它按「决定事项／待办／负责人」整理成结构化纪要。\n\n诀窍还是「真做」：拿你真要开的一场会、真要做的一份汇报来练。\n\n今天用 AI 产出一份你真要用的 PPT 或纪要。",
"F6-2":"信息爆炸时代，光靠脑子记不住——这关给自己搭一个「第二大脑」：外挂的记忆库。\n\n起步很简单：先定一个「我总在找、却总找不到」的信息类型（比如客户资料、工艺参数、常用模板），把它归好档、存进一个固定的地方。\n\n关键不在工具多高级，在「固定入口 ＋ 统一分类」——以后找东西不再满世界翻。\n\n这个知识库，也是 B3 里说的「外部存储」，以后喂给 AI 当资料室用。\n\n今天搭起你的个人知识库雏形。",
"D3-1":"流程改造最常见的错误：一上来就买工具、上系统，结果流程没理清，工具白搭。\n\n正确顺序是反的：先把「现在人是怎么干的」完整画出来——一步都别省、别美化。\n\n画完你往往会看到：有些步骤本来多余、有些环节可以合并、有些其实不需要 AI，简化就够了。\n\n先看清现状，再谈「哪里让 AI 接」，才不会为了用 AI 而用 AI。\n\n今天先画一张完整的现状流程图。",
"D3-2":"流程画完了，这关决定「从哪一步开始让 AI 接手」。\n\n选择原则：从「规则清晰、风险低、错了容易改」的那一步开始，别一上来就动最复杂、最敏感的环节。\n\n比如一份报价单，先让 AI 帮你核对格式和数字，暂时别让它直接给客户报价。\n\n先在小步上跑通、建立信心，再逐步扩大——这就是「试点」的思路，也是后面 D5 要展开的。\n\n今天标出你流程里「优先让 AI 接」的一步。",
"C4-1":"算 AI 的成本，最容易犯的错：只看「单价」，不看「总账」。\n\n单价是「每次调用多少钱」，总账（TCO）是「一年下来一共花多少」——包括调用费、工具订阅费、你的学习时间、返工成本。\n\n陷阱在这：单价降了，但用了 AI 之后「调用次数暴涨」——以前一件事问 1 次，现在流程自动跑，一天跑几百次。次数一涨，总账反而更高。\n\n所以做任何 AI 成本决策，都要算「单价 × 次数」的总账。\n\n今天做一张 TCO 测算表。",
"C4-2":"上关你算了总账，这关理解背后的「推理悖论」——一个反直觉的现象。\n\n直觉是：技术越成熟，单价越便宜。但现实是：单价确实在降，AI 的总花销却可能猛涨。有权威机构预测，到 2028 年单个智能体工作流的推理成本要涨 5 倍以上。\n\n为什么？因为便宜之后，大家用的场景更多、跑得更频繁、任务更复杂——省下来的钱又被「用得更多」吃回去了。\n\n对你的启示：别只看「每次多少钱」，要盯着「一个月一共花多少」。\n\n今天用这个悖论，解释「单价降了，总花销反而可能升」。",
"C5-1":"AI 答得不好，先别急着换工具、换模型——很多时候根子在「数据」。这关学一次排查。\n\n问三句：①它看到的数据是全的吗？②数据是最新的吗？③数据格式一致吗（同一个东西有没有两种写法）？\n\n脏数据、旧数据、格式乱，都会让 AI 得出离谱结论——这就是「垃圾进，垃圾出」。\n\n排查顺序：先查数据，再查提示词，最后才怀疑模型。大部分人反着来，白花很多冤枉钱。\n\n今天拿一次 AI 答得差的经历，做一次数据瓶颈定位。",
"D4-1":"当 AI 真的开始承担一项工作，它就跟新员工一样，需要一张「岗位说明」。\n\n要写清三件事：①对接人是谁（出问题找谁、谁来验收）；②怎么交接（它交什么格式的产出、什么时候交）；③责任归属（它干的活出了错，算谁的）。\n\n别小看这三条——很多企业用 AI 翻车，不是技术不行，是「没人负责这块活」。\n\n把 AI 当同事看，就得先把「职责」说清楚。\n\n今天给你要引入的 AI 角色写一份「入岗说明」。",
"D5-1":"一个组织要用好 AI，不是一步到位，而是分三阶走。\n\n①试点：选一个小组、一个场景先跑通，验证有效；\n\n②推广：把跑通的做法复制到更多团队；\n\n③制度化：写进流程和考核，变成日常操作，不靠个人热情。\n\n每一阶都要有「验收信号」：试点看「有没有效」，推广看「能不能复制」，制度化看「离了发起人还转不转」。\n\n跳过任何一阶都容易翻车——尤其别跳过试点直接全面推。\n\n今天画一张你自己的「组织推进三阶」图。",
"D5-2":"组织推 AI，一定遇到三类阻力。提前想好对策，才推得动。\n\n①焦虑：员工怕被替代 → 对策是讲清「AI 接什么、人干什么」，把新技能培训跟上；\n\n②不愿改：习惯了老办法 → 对策是让「用了 AI 的人」现身说法，用结果说话；\n\n③知识流失：老师傅的经验没沉淀，人一走就没了 → 对策是把隐性经验显性化、存进知识库（这也是 F6 第二大脑的意义）。\n\n变革管理的核心不是「下命令」，是「把人的顾虑接住」。\n\n今天列一张「焦虑／激励／知识流失」对策表。",
"G5-1":"学了这么多，这关把镜头转向你自己：人机协作下，我缺什么？\n\n用「能力闭环」四步给自己打分（每项 1–5 分）：①分工（我会判断该不该交 AI 吗）②指令（我能把要求说清楚吗）③评估（我能判断它的输出靠谱吗）④担责（我知道边界和责任吗）。\n\n分数最低的那项，就是你最该补的短板。\n\n诚实一点打——这张表是给自己看的，不是给别人看的。看清短板，才知道往哪使劲。\n\n今天给你自己的四个维度打分，列一份「能力缺口清单」。",
"G5-2":"看清了缺口，这关把它变成一个「下月就能做」的动作。\n\n别写「我要多学 AI」这种空话——太空的目标等于没目标。把最弱那一项，翻译成一个具体的、能检查的动作。\n\n比如最弱的是「评估」，那就定：「下个月，每次用 AI 出东西，都走一遍三查，并记录 3 次。」\n\n学习计划的意义不在「计划多完美」，在「下个月真的会做」。\n\n这也是你从「学完这一棵树」走向「持续修炼」的起点。\n\n今天写下你的下月学习计划，只写最弱那一项。",
"D6-1":"你快要走完整棵树了。这一关开始「沉淀」——首先建一个「本行业用例库」。\n\n做法：收集你所在行业 3 个真实的 AI 应用案例，每个标上「有效／无效／存疑」，并写一句判断理由。\n\n为什么标三档？因为行业里吹得太多的案例，其实一半是「存疑」的——会分辨，比会收集更值钱。\n\n这个库建起来，就是你从「自己会用」走向「能判断行业趋势」的第一步。\n\n今天收集并评估 3 个本行业真实用例。",
"D6-2":"最后一关：把你的经验变成「别人的说明书」。\n\n做法很简单：把你这一路怎么做的——怎么分工、怎么写指令、怎么评估、怎么担责——整理成一份「别人能照着做」的说明。\n\n判断标准：一个没学过的人，拿这份说明能不能上手？能，就说明你真正懂了。\n\n这一步的意义是：从「我会用」到「我能教」，你就从「学徒」变成了「真传」，后面才有资格当导演。\n\n今天整理出一份可复用的方法论说明，然后去答毕业五问。",
"A2-3":"同一家公司往往有好几款模型，就像同一家车企既有轿车也有卡车。先记住一个大分类：通用型和推理型。\n\n通用型是「快嘴」：你问一句它答一句，便宜、够快，适合润色、分类、日常问答这类不需要绕弯的活。\n\n推理型是「慢脑」：它会先在草稿纸上推一遍再答，慢一点、贵一点，但遇到多步推理、算账、逻辑题明显更稳。\n\n还有一个「旋钮」问题 —— 很多工具里能调「随机性」（常叫温度）。调高，答案花哨多变；调低，答案稳定保守。写文案想要惊喜可以调高，做数据、讲事实就该调低。\n\n判断口诀：先问「这活错了代价大不大、要不要绕弯」。代价大、要绕弯就上推理型；否则通用型又快又省。\n\n旋钮默认别乱动，知道它存在就行 —— 大部分人根本用不到它。\n\n今天你就做：给「写周报」和「解一道逻辑题」各挑一类模型，写下理由，再补一句「这个活我并不需要动旋钮」。",
"A2-4":"有些边界容易被忽略，但会实实在在坑你 —— 模型其实并不知道「今天」。\n\n第一个边界是「能看什么」：能不能读图、听声、看视频，这叫多模态能力。有的模型只认字，你发张图它当噪音；有的能看图还能画图。用之前先确认它长没长这只眼睛。\n\n第二个边界是「知道到哪天」，叫知识截止。模型的知识停在训练那一天，之后的新闻、新政、新价格它一概不知。所以问时效性的事，别问它「知不知道」，要让它「去查」（回想 B2 的工具调用）。\n\n第三个边界是「什么脾气」：有的模型天生爱堆四字短语、爱下结论、爱说「综上所述」；有的平实。这不是对错，是习惯。你要做的是顺着它的脾气改指令，而不是每次都被它带跑。\n\n记住一句话：模型的自信程度不等于正确程度（A5 就教过），而「它不知道」往往装得跟「它知道」一模一样。\n\n今天你就做：用三行写下你常用模型的「能看什么、知道到哪天、什么脾气」，贴在工位上。",
"A4-3":"打开一张模型榜单，满屏第一、第二，很容易让人以为「跟着买就对了」。但榜单是给别人出的考卷，不是给你的。\n\n第一件事：看清它考的是什么。榜上的「数学」「代码」「长文理解」是分开算的，某一项第一，换个项目可能掉出去。你的活属于哪一类，就看哪一类。\n\n第二件事：分清「考试」和「干活」。榜单多是一次性、有标准答案的题；真实工作是多轮、要工具、错了要返工的。这就是为什么同一个模型换一套外壳（Harness，见 B8）表现能差很多 —— 榜上那点分差，常常被外面这层放大或抹平。\n\n第三件事：警惕营销话术。「全面领先」「颠覆」这类词是给投资人看的，不是给你选型用的。你要的是「这项能力对我的活有没有用」。\n\n榜单的正确用法：当成筛子，不是当成答案。先用它排除明显不合适的，再拿自己的两件真实活去试。\n\n今天你就做：找一张榜单，逐项标出「这项对我的活有没有用」，再写一句「榜单不能告诉你什么」。",
"B9-1":"前面你学的都是零件：模型、指令、工具、记忆、循环…… 但零件摆一桌，你还是不知道一台整机长什么样。这关先把总装图补上。\n\n一台 Agent 就是七块拼的：模型（脑子）、指令（岗位说明书）、工具（手脚）、记忆（便签加档案柜）、循环（决定下一步的那口气）、输出（交活的形式）、权限（能碰什么、不能碰什么）。\n\n关键认知：模型只占一块。市面上说「换个更强的模型就好了」，其实决定它好不好用的，往往是剩下六块 —— 就像同一台发动机装在拖拉机和轿车上，跑出来的东西完全不同（这就是 B8 讲的 Harness）。\n\n拼装顺序也有讲究：先想清楚「交什么活」（输出），再定「它管到哪一步」（权限与循环），最后才挑模型。反过来先挑模型，常常是白花钱。\n\n别把 Agent 想成「更聪明的对话框」。对话框里没有工具、没有记忆、没有循环，也没有权限 —— 它只会说话。\n\n今天你就做：画出「模型加指令加工具加记忆加循环加输出加权限」七块拼装的整机图，标出哪一块最影响好不好用。",
"B9-2":"装好了整机，看它跑一次。你发一句话，它不是「一下就懂了」，中间有个固定套路。\n\n第一步：收到与理解。它读你的话，加上系统提示（岗位说明书）和记忆，拼成一份「这次要干什么」的作业单。\n\n第二步：找料。它去翻记忆、查知识库、看有哪些工具能调用 —— 这一步对应整机里的「记忆」和「工具」。\n\n第三步：决定下一步。这是 Agent 与 Workflow 的分水岭：不是照流程图走，而是它自己判断「现在该调哪个工具」。\n\n第四步：动手。真去调工具、真去执行，拿到结果。\n\n第五步：看结果对不对。对了就往下走，不对就回去重来 —— 这个「回去」就是循环，也是你见过它说「我再检查一下」的原因。\n\n看明白这五步，你就能定位问题：它答得离谱，多半在第一步（你没说清）；它凭空瞎说，多半在第二步（没去查）；它半路卡住，多半在第三步（不会判断）；它乱动手，出在第四步和权限。\n\n今天你就做：写下这五步，并标出每一步对应整机图的哪一块。",
"B9-3":"七块都学会很累，也没必要。这一关教你把力气花在对的地方。\n\n分三种处理：我定（决定好不好用、错了代价大）、交给平台（有默认值且够用）、先默认（等出问题再说）。\n\n我的经验排序：指令和权限必须你定 —— 一个是它有没有听懂，一个是它能闯多大祸。这两块交给别人，等于把方向盘交出去。输出和循环的停止条件也该你定，因为那是「什么算干完」的定义。\n\n可以放心交给平台的：模型（按任务挑一款够用的就行）、记忆的存储实现、工具的具体接法 —— 这些平台通常比你自己折腾得稳。\n\n判断标准只有一条：这块搞错了，我兜得住吗？兜得住就交给平台；兜不住就你亲自定。\n\n别追求七块都精通。导演不必会开每一台机器，但必须知道哪台机器不能松手。\n\n今天你就做：逐块标「由我定 / 交给平台 / 用默认」，写下理由。",
"E1-4":"很多人改指令是「全改一遍再试」—— 结果变好了也不知道为什么，变差了也找不出是哪句惹的祸。这关教你一个笨但有效的办法。\n\n做法：同一份指令改三次，每次只动一处。常见的三处是 —— 篇幅（长一点还是短一点）、语气与角色（换成对方的同行口吻）、例子（给一个样本让它照样子）。\n\n为什么必须只改一处？因为只有这样，结果的差别才能归因到那一处。三处一起改，你等于在黑暗里换零件。\n\n记录也很重要：每次只写一行 —— 「这次改了什么，结果哪里变了」。三次之后回看，你通常会发现自己反复在改「篇幅」，而真正让结果变好的其实是「给了个例子」。\n\n这条方法和 B1 讲的反思回路是一对：AI 自查是它自己回头，你迭代是你回头。它自查降低出错率，你迭代提高上限。\n\n今天你就做：把同一份指令改三次，每次只动一处，记录哪一次提升最大。",
"E7-1":"打开搜索框搜「AI 智能体平台」，你会看到一堆名字：Coze、Dify、腾讯元器、GPTs，还有各种企业平台。它们看起来都在做同一件事，其实不是。\n\n先分三类。对话型：在一个现成的助手商店里配一个自己的助手，改的是提示词和知识库，上手最快，适合先试试水。搭建型：可以拖出流程、接自己的数据和 API，能做出真正干活的 Agent，适合有明确业务场景的人。企业型：面向单位采购，管权限、管数据隔离、能对接内部系统，个人一般用不上。\n\n看三个问题就能分类：一是给谁用（个人 / 团队 / 企业）；二是要不要写代码（纯配置 / 可写少量 / 要开发）；三是数据存在哪（存在平台云上 / 存在你自己环境 / 存在单位内网）。\n\n第三点最容易被忽略，但它往往决定你能不能真的用 —— 客户名单、内部资料，不该随手贴到公网平台。\n\n分完类你会松一口气：你不需要「最好的」，你需要「能跑通又兜得住的那一类」。\n\n今天你就做：把至少 4 个平台按这三点画成一张生态地图。",
"E7-2":"分类之后就到了最难的一步：到底选哪个。多数人在这里翻车的方式是 —— 到处注册，每个都试一半，最后一个都没跑通。\n\n换一个顺序：先看能不能跑通。你的活需要一个能读文件的工具，那这个平台支不支持上传文件？需要每天定时跑，那它有没有定时任务？能不能跑通是硬条件，不满足就直接排除，别管它名气多大。\n\n再看数据在哪。你要处理的资料敏感吗？如果涉及客户、合同、内部数据，那你得知道它存在哪、会不会被拿去训练。这一步很多平台藏得比较深，要专门去翻隐私条款和设置页（这也正是 C6 和 G4 管的范围）。\n\n最后看额度够不够。免费额度能撑多久、超了怎么计费、有没有预算上限 —— 不问清楚，第一次账单会让你记很久。\n\n三条都过，再谈体验好不好。别反过来：先看界面漂亮，最后发现数据不能放上去。\n\n今天你就做：给自己选一个平台，写下三条理由，其中一条必须关于数据。",
"E7-3":"选好平台，别急着敲第一行指令。开工前花十分钟看清三件事，能省后面无数麻烦。\n\n一是账号体系：用个人账号还是企业账号？能不能多人协作？换个设备还能不能登录？这一条决定了这活是「你一个人的玩具」，还是「团队能接手的东西」。\n\n二是免费额度与计费方式：额度按什么算（次数 / 字数 / 执行时长）？超了自动停还是继续扣钱？有没有地方设上限？如果没地方设上限，那这就是个隐患，先记下来。\n\n三是数据存放与训练政策：你上传的资料存在哪、保留多久、会不会被用来训练模型。找不到明确说法的，就按「会」来假设，别放敏感数据。\n\n这三件事写成一张「开工前必看」，贴在项目旁边。它不是一次性功课 —— 平台政策变得很快，隔一阵要回头对一遍。\n\n今天你就做：写一张「平台开工前必看」，把账号、额度、数据三件事填上。",
"A6-1":"「AI 一天一个样，我是不是刚学就过时」—— 这个焦虑很真实，但它其实是个可以工程化解决的问题。\n\n先分清两层：结构层和接口层。结构层是「Agent 由哪几块构成、为什么要循环、为什么要设权限」—— 这些几年内不会变。接口层是「哪个模型最强、每秒多少钱、这个平台叫什么」—— 这半年就换一轮。你真正要学的是结构层，会过时的是接口层。\n\n所以「学完就过时」这个担心，多数是假的。真正会过时的，是价格和按钮位置，不是你脑子里的框架。\n\n那接口层的变化怎么办？别追，装雷达。给自己定三个信号，比如：你常用平台的官方更新日志；一两个权威年度报告（这类报告一年一次，看一次顶半年）；一个你信得过的行业观察者。定完之后，到点看，平时不看。\n\n这样你就不用「天天焦虑」，而是「到点被提醒」。焦虑变成待办，待办是可以完成的。\n\n今天你就做：写下「现在到哪了、往哪走、我盯哪三个信号」，每个信号要能具体到「去哪个页面看什么」。",
"B5-3":"上一关你画了协作图，这一关把它落到能执行的文字上 —— 写角色卡。\n\n一张角色卡只要三行：干什么（职责一句话）、不许干什么（边界，最重要）、交给谁（它的产出归谁消费）。\n\n为什么「不许干什么」最重要？因为一群 AI 打架，几乎都是因为边界没写。写手顺手把事实也编了，审查者顺手把格式也改了，最后谁都不认账。把「不许做的事」写清楚，比把「要做的事」写长更有用。\n\n举个例子：你是资料整理者 —— 把长文压成要点，每行必须带出处；不许下结论、不许改写原意；产出交给写手。\n\n再看「交给谁」这一行。它保证信息有明确的去向，不会出现「三个 AI 都产出了一份，然后没人汇总」。\n\n写角色卡不用一次到位。先按你现在能想到的写，跑一次，哪一步乱了就回来补那张卡的边界。\n\n今天你就做：给你的一群 AI 各写一张卡，三行，必须写「不许干什么」。",
"B5-4":"多 Agent 最大的坑不是「不干活」，是互相污染 —— 一个 AI 猜错了一次，这个错被写进共享记录，后面每个 AI 都拿着它当事实，越跑越歪。\n\n防法一：上下文隔离。谁该看到什么，提前定好。审查者不该看到写手的草稿思路，只该看到成稿；执行者不该看到全套背景，只该看到这一步的参数。看得越少，被带偏的机会越小。\n\n防法二：主从复核。关键结论不自己确认，交给另一个 AI 用不同角度复核一遍。注意是「另一个」—— 同一个 AI 自己复核自己效果很有限，因为它会沿着原来的思路走。\n\n防法三：结论要带证据。让每个 AI 在给结论时附上来源（哪份文件、哪一步的输出）。一旦串味，你能顺着证据链找到是哪一环开始错的 —— 这也接上了 C2 的可观测。\n\n一句话总结：多 Agent 不是「人多力量大」，而是「分工加隔离加复核」。少一样，就是一群会互相传染的嘴。\n\n今天你就做：画一张「谁看得到什么」的隔离图，并标出必须有另一个 AI 复核的那一步。",
"B7-3":"前面两关讲了 MCP 是什么、价值在哪，都是看图。这一关动手，亲手接一次，以后就不怕了。\n\n第一步：找到入口。支持 MCP 的工具一般有个「连接器 / 集成 / MCP」的设置页。找不到就去官方文档搜 MCP —— 注意，不同产品叫的名字不一样，别被名称卡住。\n\n第二步：授权。接一个官方 MCP 通常要你点一次「允许」，相当于告诉工具「这个外部服务我同意你连」。这一步会弹到对方站点登录，属于正常现象。\n\n第三步：验证。别以为点完就接上了。回去问它一件只有接了才答得出的事（比如你刚授权的那个服务里的一个实时数据）。答得出，才算真接上。\n\n接不上怎么办？先别怀疑自己。最常见的原因是三类：授权过期或被撤销、网络受限、版本对不上。把这三条记下来，下次照着一层层排。\n\n接口这东西，看一百遍不如亲手接一次。接完你会发现它跟「给手机装个 App 再授权」没什么本质区别。\n\n今天你就做：授权接一个官方 MCP，验证它真的接上了，并记下你最可能遇到的一个失败原因。",
"D2-3":"前面讲的组织视角很有用，但它有个副作用：你会开始等 —— 等单位采购、等领导批、等别人先动。这一关把视角拉回你自己。\n\n规则只有三条：一是不依赖任何授权（用你个人能打开的公开工具）；二是不涉及敏感数据（既然不经过单位，更要守边界）；三是今天就能试（十分钟能上手的那种）。\n\n怎么找？把一天拆成几个动作，逐个问「哪一步是重复的、有固定格式的、错了能重来的」。这三类基本都能交出去：写初稿、整理会议要点、把长文压成要点、把表格清洗成统一格式、把口播稿改成书面语、给图片配文字、翻译、做一份初版 PPT 大纲……\n\n注意这里的分寸：是「让 AI 出初稿，你来定稿」，不是「交给它然后不管」。你仍然是那个拍板的人，这正是 D1 讲的分工。\n\n写十条的意义不在于十条都能用，而在于你会开始用「可不可交出去」的眼光看自己的工作 —— 一旦有了这个眼光，你每天都会发现新的。\n\n今天你就做：列出你岗位上 10 个「今天就能用」的场景，挑出最值得先做的那 1 个。",
"E8-1":"Agent 不干活或者干错活，大多数人的第一反应是「改提示词」。这是最省力、也最容易白费力的做法 —— 因为问题常常不在提示词那一层。\n\n按三层查，从便宜到贵。\n\n第一层：它有没有按我说的做（指令）？把它的实际输出跟你写的指令逐条对一遍。八成的问题在这一层：要求含糊、缺了格式、或者几个约束互相打架。\n\n第二层：它有没有拿到该拿的东西（数据与工具）？需要查的资料有没有给它？知识库里有没有那份文件？工具授权了吗、接通了吗？这一层的典型症状是「它一本正经地编」，其实是因为它根本没法查。\n\n第三层：流程本身设计错了吗（设计）？前两层都排除了，才轮到怀疑设计：是不是这一步本来就不该让 AI 做？是不是把两件事塞进了一个 Agent？这时候要改的是结构，不是措辞。\n\n顺序不能反。反了就会出现「在错的层上使劲」—— 改十遍提示词，问题其实在没接通工具。\n\n今天你就做：拿一个「不干活」的 Agent，按三层顺序查一遍，写出是哪一层出了问题。",
"E8-2":"上一关查了一次，这一关把经验沉淀下来 —— 下次不用重新想。\n\n做一张四列的表：症状（你看到什么现象）、先查哪一层（指令 / 数据工具 / 设计）、常见原因、怎么改。\n\n举几个常见的行：看到「答得很空、都是套话」，先查指令层，常见原因是没给角色和约束，改法是补上四要素（E1）；看到「引用的资料是假的」，先查数据层，常见原因是知识库里没有那份文件、或者切片太碎，改法是先补资料再调切片；看到「跑到一半卡住不结束」，先查循环，常见原因是没有停下来的条件，改法是加一条「最多跑几步」。\n\n这张表的用法是：先照着症状找到那一行，再看「先查哪一层」—— 它防止你本能地跳到提示词。\n\n一件事值得强调：症状写得越具体越好。「效果不好」这样的写法没用，「写的报告总爱加一段没用的总结」才好用，因为后者直接指向了指令里的哪一句。\n\n今天你就做：整理至少 4 个你真实遇到过的症状，写成这张排错顺序表。",
"E8-3":"这一关讲的是「什么时候该认输」，而认输往往是最好的决策。\n\n信号很清楚：同一个问题调了三轮以上，每次都「好一点但还是不稳」，而且改动越来越多、流程越来越绕。这时候你不是在优化，是在给一个本来就不该用智能体的活打补丁。\n\n回想第一原则：能自动化别上智能体（E3 早已说过）。如果一件事的规则完全说得清、输入输出固定，那它要的是自动化脚本或流水线，不是 Agent。Agent 的价值恰恰在处理「规则说不清、要现场判断」的那部分。\n\n退回去的三种走法：把这段改成固定规则，交给传统自动化；只保留判断的那一小段给 AI，其余走规则；把任务拆小，让 AI 只做它擅长的那一步，剩下的用人兜住。\n\n判断口诀：如果我能把这件事的判断规则写成一张纸条，那它就不需要 Agent。\n\n今天你就做：挑一个调了三轮还跑不稳的活，写下「该不该退」，并给出退回后的方案。",
"F6-3":"「第二大脑」这个词听着大，其实就是给资料修一条流水线。四步：采集、组织、检索、复利。这关做前两步。\n\n采集：修一个统一入口，别让资料散落在微信收藏、截图、下载文件夹、便签里。入口要满足一件事 —— 你看到东西时两秒内能存进去。两秒做不到，你就不会存。\n\n组织：建抽屉，但别建太多。一开始三个就够，比如「正在做的」「以后可能用的」「参考资料」。分类太细的后果是每次存东西都要想「这算哪类」—— 想两次之后，你就不存了。\n\n这两步的关键不是工具，是降低摩擦。第二大脑失败几乎都不是因为工具不好，而是因为存的时候太麻烦。宁可分类粗一点、入口傻一点，也要保证你真的会用它。\n\n一个反直觉的建议：不要一开始就整理旧资料。先把新的存顺了，跑两周，你自然知道该建哪些抽屉 —— 那时候再回头收旧账。\n\n今天你就做：设一个统一入口，建三个抽屉，把最近一周的零散资料收进去。",
"F6-4":"前两步做完，最容易变成「高级垃圾桶」—— 东西存得很整齐，但从来不用。后两步治这个病。\n\n检索：不要「想起来才翻」，要在干活前先搜一下。做方案前搜「方案」，写周报前搜「周报」，你会发现上次的做法还在，改一改就能用。检索的关键是关键词要对得上 —— 这就回到 F6-3 说的命名。\n\n复利：这一步最少人做，也最值钱。用完一次之后，把这次的成果回写成一条笔记：不是存原始资料，而是存「这次是怎么做的、结论是什么」。下次遇到同类事，你搜到的不是一堆素材，而是一个已经验证过的做法。\n\n举个例子：你为一个客户做了报价分析，素材收进去只算「组织」；把「这类客户的报价逻辑是 A，注意点是 B」写成一条笔记，才是「复利」。前者是存货，后者是资产。\n\n坚持一两个月，你会明显感到差别：别人每次从零开始，你每次都在上一次的肩膀上。这就是「越用越省力」。\n\n今天你就做：用检索解决一件真事，然后把结果回写成一条可复用的笔记。",
"C4-3":"上一关你会算总账了，这一关动手省。\n\n缓存：同一类问题答案稳定，就把结果存下来，下次直接取，不重复问模型。比如固定的分类、固定的翻译。\n\n模型降级：不是所有活都值得上好模型。先问「这件事错了代价大吗」—— 代价小就用便宜的。很多人账单高，是因为一直用牛刀杀鸡（E2）。\n\n批处理：把零散的小请求攒成一批一起跑，通常比一条一条便宜，也更稳。\n\n预算护栏：这一条最重要，也最常被跳过 —— 提前定一条线：花到多少就停。平台里能设上限就设上限，设不了就在自己流程里加一步「先算再用」。没有护栏，出事时你只会在账单上看到它。\n\n四个动作的排序建议：先上护栏（保命），再上降级（省钱最多），最后才折腾缓存和批处理（省得细）。\n\n一句话：省钱的本质不是找便宜的模型，是别把贵的用在不值得的地方。\n\n今天你就做：写下你的四个省钱动作，并给自己定一条「花到多少我停」。",
"C5-2":"「我的资料怎么变成 AI 能用的东西」—— 这关给你一条能走的路。\n\n第一步：选料。不是所有资料都值得喂。先问一句：这份资料能回答哪一类问题？答不上的就先别进。一股脑全丢进去，结果就是检索出一堆没用的段落，AI 反而更容易答偏。\n\n第二步：清洗与命名。把页眉页脚、扫描噪字、重复段落清掉；然后给文件起一个「能被搜到」的名字。文件名很关键 —— 你将来是拿关键词去检索它，名字里带上「对象加事由加时间」，命中的概率会高很多。\n\n第三步：脱敏。客户姓名、手机号、身份证、报价明细，凡是不能外流的，要么去掉、要么替换成代号。这一步别指望平台帮你，得你自己在入库前做掉（接 G2 数据分级）。\n\n三步做完，你会发现一件有意思的事：整理资料这活看着像杂事，其实决定了 AI 好不好用。数据脏，用什么模型都白搭。\n\n今天你就做：挑一份你自己的真实资料，走完选料、清洗命名、脱敏三步，产出一个能入库的样本。",
"C5-3":"整理完了，还得决定「放哪儿」。全塞进长期知识库，不仅贵，还会互相干扰。\n\n分两层就够。一次性问答：这份资料只为当下这一件事服务，问完就完了 —— 直接贴进对话里，不必入知识库。长期知识库：这类问题你会反复问、而且资料会更新 —— 才值得建库、切片、维护。\n\n判断标准是「复用频率」，不是「资料重不重要」。很多人把重要的资料全塞进知识库，结果每次检索都捞回一堆不相干的段落，效果反而更差。\n\n再写一条回头改的入口：效果不好时按顺序查 —— 是没检索到（那要改切片和命名）；是检索到了但答案没用到（那要改指令）；是资料本身就旧了（那要更新源文件）。\n\n有了这条顺序，你就不用每次都从头怀疑。数据这件事，七成的问题出在检索，不是出在模型。\n\n今天你就做：给你的资料分两层，并写下「效果不好时我先回头改哪一层」。",
"C6-1":"前面讲的都是「怎么让它跑起来」，这一关讲「怎么防它跑歪」。先认识五种翻车。\n\n循环失控：它在一个步骤里来回打转停不下来，账单一直涨。原因是没设「最多跑几步」。\n\n静默错误：它说自己成功了，其实结果是错的。最危险的一种，因为你不会去查 —— 直到下游出事。\n\n上下文污染：一次错误被写进记录，后面每个步骤都拿着它当事实，越跑越歪（B5 讲过多 Agent 的版本，单 Agent 同样会发生）。\n\n工具幻觉：它编出一个不存在的工具名，或者给真工具编了一套不存在的参数，然后一本正经地调用失败。\n\n预算穿透：花超了才发现。没人设上限，或者上限设在平台外面（自己的流程里）却没生效。\n\n五种里，最该警惕的是静默错误 —— 其他四种你还能从现象上察觉，它不会喊，只会安静地把错的当成对的往下传。\n\n今天你就做：给这五种各举一个真实或可能的例子，并说出它属于哪一类。",
"C6-2":"认完五种翻车，这一关给每种配一副刹车。\n\n循环失控配熔断：设「最多跑 N 步」和「最多花 X 元」，到线就停，把中间结果交出来。别指望它自己意识到在打转。\n\n静默错误配事后核对：让它在关键结论上附证据和出处（接 C2、G1），你抽查。抽查不用全查，但抽查这个动作必须在流程里。\n\n上下文污染配重开一轮：发现歪了，别在脏上下文里继续修，直接带着「哪一步开始错的」重开一轮。\n\n工具幻觉配白名单：只允许调用明确列出的工具，参数要校验。不在单子上的，一律拒绝。\n\n预算穿透配双护栏：平台内的额度上限，加上你自己流程里的花费检查，两道都要有。\n\n最后一条最重要：人工回退线。写下「什么情况下必须交回人」—— 涉及钱、涉及对外发布、涉及删改数据、连续失败两次。这几类不许自动跑到底。\n\n成功率 95% 听起来很高，但真正要紧的是「剩下那 5% 是哪 5%」。兜底设计的本质，就是把那 5% 提前想清楚。\n\n今天你就做：做一张「失败模式到兜底动作」对照表，并写一条你的人工回退线。"
};

<script>
/* ============================================================
   应用层
   ============================================================ */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

var NODE_BY_ID={}; NODES.forEach(function(n,i){NODE_BY_ID[n[0]]={i:i,id:n[0],axis:n[1],stage:n[2],rank:n[3],prereq:n[4]?n[4].split(","):[],tm:n[5],name:n[6],goal:n[7],out:n[8],anchor:n[9]}});
var LEVELS=RAW.map(function(r){return {id:r[0],node:r[1],title:r[2],action:r[3],out:r[4],fb:r[5],checks:r[6]?r[6].split("|"):[],next:r[7],loop:!!r[8],opt:!!r[9]}});
/* 兜底：万一内容层出现"微关挂到不存在的节点"（数据漂移），也不该白屏 —— 降到阶段0 并继续跑 */
LEVELS.forEach(function(l){var n=NODE_BY_ID[l.node];l.stage=n?n.stage:0});
/* ★ v0.8.0「主路 / ⭐选读」（v1.4 §2.3）：
   选读关默认折叠，且**不计入**段位小阶 / 进度 / 毕业门槛 —— 所以全局进度口径 TOTAL
   取「主路」关数；ALL / OPTS 只用于"含选读"的完整展示。 */
var ALL=LEVELS.length;
var LEVELS_MAIN=LEVELS.filter(function(l){return !l.opt});
var TOTAL=LEVELS_MAIN.length;
var OPTS=LEVELS.filter(function(l){return l.opt}).length;

var KEY="zhixiu_p0_v1";
function fresh(){return {started:false,done:{},checks:{},ach:{},streak:0,last:null,grad:{},flt:{branch:"all",stage:"all",todo:false,opt:false}};}
/* 读存档：逐键补默认 + 类型校验，脏存档/旧版本存档一律安全降级，不让界面崩 */
function load(){
  var f=fresh();
  try{
    var r=localStorage.getItem(KEY); if(!r)return f;
    var o=JSON.parse(r); if(!o||typeof o!=="object")return f;
    Object.keys(f).forEach(function(k){
      var v=o[k],t=typeof f[k];
      if(t==="object"){ o[k]=(v&&typeof v==="object"&&!Array.isArray(v))?v:f[k]; }
      else if(t==="boolean"){ o[k]=(typeof v==="boolean")?v:f[k]; }
      else if(t==="number"){ o[k]=(typeof v==="number"&&isFinite(v))?v:f[k]; }
      else { o[k]=(typeof v==="string")?v:f[k]; }
    });
    return o;
  }catch(e){return f}
}
var S=load();
/* 写盘（v0.6.1）：**失败绝不静默**。进度是本产品的核心资产，而 iOS/桌面 Safari 无痕模式
   的存储配额为 0、setItem 必抛 —— 旧版用 `catch(e){}` 空吞，用户连做 8 关后刷新回到萌新且毫不知情。
   现在：返回真假 + 失败提示一次 + 顶栏常驻「未保存」标记（标记不会被后续 toast 冲掉，是权威信号）。 */
var SAVE_WARN="⚠️ 本次进度没保存上 —— 本机存储不可用（如浏览器无痕模式）。请用普通窗口打开，先别关这个页面";
var _saveFail=false;
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    if(_saveFail){_saveFail=false;syncSaveFlag()}
    return true;
  }catch(e){
    if(!_saveFail){
      _saveFail=true;syncSaveFlag();
      /* 延迟一拍：确认这条警告排在本次交互里其它 toast 之后，不被"已撤销"之类的话盖掉 */
      setTimeout(function(){toast(SAVE_WARN)},0);
    }
    return false;
  }
}
function syncSaveFlag(){var el=document.getElementById("tbSave");if(el)el.classList.toggle("hidden",!_saveFail)}

/* --- derived --- */
/* 进度口径（v0.8.0）：只数「主路」关；选读关单独计数，不参与段位 / 毕业 */
function doneCount(){return LEVELS_MAIN.filter(function(l){return S.done[l.id]}).length}
function doneOpt(){return LEVELS.filter(function(l){return l.opt&&S.done[l.id]}).length}
function nodeLevels(id){return LEVELS.filter(function(l){return l.node===id})}
/* 点亮口径（v0.8.0）：节点下「主路」关全过即点亮；只含选读关的节点（如 A6）按全部关算 */
function nodeMain(id){var a=nodeLevels(id).filter(function(l){return !l.opt});return a.length?a:nodeLevels(id)}
function nodeDone(id){return nodeMain(id).filter(function(l){return S.done[l.id]}).length}
function stageLevels(i){return LEVELS_MAIN.filter(function(l){return l.stage===i})}
function stageDone(i){return stageLevels(i).filter(function(l){return S.done[l.id]}).length}
function curRank(){
  var d=doneCount(),r=RANKS[0];
  RANKS.forEach(function(x){if(d>=x.min)r=x});
  /* 注意：学徒的 floor 就是 0，不能用 truthy 判断，否则学徒段进度永远卡在 0/8 */
  var done=Math.max(0,d-(r.floor||0)),span=r.span,ratio=span?Math.min(1,done/span):0;
  var si=ratio>=1?3:ratio>=.75?2:ratio>=.5?1:0;
  return {rank:r,doneIn:Math.min(done,span),span:span,ratio:ratio,sub:r.span?SUBRANK[si]:"初识",next:RANKS[RANKS.indexOf(r)+1]||null};
}
/* 推荐下一关：选读被隐藏时不该指向一关看不见的卡（承 v0.8.0 选读折叠） */
function nextLevel(){var pool=fltDefault().opt?LEVELS:LEVELS_MAIN;for(var i=0;i<pool.length;i++){if(!S.done[pool[i].id])return pool[i]}return null}
/* --- 系统性感知（v0.6.0）：全局口径 —— "我在整座山的哪里" ---
   节点"点亮"定义：该节点下的微关全部过完（t>0 且 dn>=t）。
   口径统一从这里取，页面与冒烟断言共用一套算法，防止两处各算各的。 */
function nodeFull(id){var t=nodeMain(id).length;return t>0&&nodeDone(id)>=t}
function litNodes(){return NODES.filter(function(n){return nodeFull(n[0])}).length}
function grpStat(pick){
  var l=0,nn=0,dn=0,tt=0;
  NODES.forEach(function(n){
    if(!pick(n))return;
    nn++; if(nodeFull(n[0]))l++;
    dn+=nodeDone(n[0]); tt+=nodeMain(n[0]).length;
  });
  return {lit:l,nodes:nn,done:dn,total:tt};
}
function axisStat(ax){return grpStat(function(n){return n[1]===ax})}
function branchStat(b){return grpStat(function(n){return n[0][0]===b})}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pctOf(f){return f.span?Math.round(f.ratio*100):0}
function dur(l){return l.loop?10:(l.checks.length>=3?8:6)}
function fltDefault(){var f=S.flt||{};if(!f.branch)f.branch="all";if(f.stage===undefined||f.stage===null)f.stage="all";if(f.todo===undefined)f.todo=false;if(f.opt===undefined)f.opt=false;return f}

/* --- nav icons --- */
var ICON={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4.2"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>',

  glossary:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h12v18H6a2 2 0 01-2-2V5z"/><path d="M8 7h6M8 11h8"/></svg>'
};
var NAV=[["today","修炼"],["map","图谱"],["rank","段位"],["glossary","术语"]];

function fillNav(){

var ROUTES={today:viewToday,map:viewMap,rank:viewRank,grad:viewGrad,glossary:viewGlossary};
function route(){var h=(location.hash||"#/today").replace("#/","");return ROUTES[h]?h:"today"}

function render(){
  var r=route();

  $$("[data-route]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-route")===r)});
  var cr=curRank();

  $("#tbDone").textContent="✅ "+doneCount()+" / "+TOTAL;
  decorate();
  if(r==="today")syncFilterBar();
  if(r!==_lastR){window.scrollTo(0,0);_lastR=r}   /* 仅切换视图时回顶；打卡/筛选不打断当前浏览位置 */
}
/* 单行芯片条（v0.3.1）：选中项自动滚入视野 + 左右边缘渐隐 + 桌面滚轮横滑
   注：offsetLeft 相对的是 position:sticky 的 .filters，故用视口矩形换算内容坐标 */
function syncFilterBar(){
  var sc=$(".fscroll"); if(!sc)return;
  var sr=sc.getBoundingClientRect();
  var on=sc.querySelector(".fchip.on");
  if(on&&sc.scrollWidth>sc.clientWidth+1){
    var or=on.getBoundingClientRect(),l=or.left-sr.left+sc.scrollLeft,w=or.width;
    if(l<sc.scrollLeft+6||l+w>sc.scrollLeft+sc.clientWidth-6){
      var t=l-(sc.clientWidth-w)/2; if(t<0)t=0; sc.scrollLeft=t;
    }
  }
  function mark(){
    var m=sc.scrollWidth-sc.clientWidth;
    sc.classList.toggle("has-more",m>2&&sc.scrollLeft<m-2);
    sc.classList.toggle("has-prev",m>2&&sc.scrollLeft>2);
  }
  mark();
  sc.addEventListener("scroll",mark,{passive:true});
  /* 旋屏/改窗宽会改变可视宽度：重算渐隐。先摘旧监听，避免每次 render 叠一个 */
  if(window._fmark)window.removeEventListener("resize",window._fmark);
  window._fmark=mark;window.addEventListener("resize",window._fmark);
  sc.addEventListener("wheel",function(e){
    if(sc.scrollWidth<=sc.clientWidth+1)return;
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;   /* 本来就是横滑手势就不劫持 */
    var atStart=sc.scrollLeft<=1,atEnd=sc.scrollLeft>=sc.scrollWidth-sc.clientWidth-1;
    if((e.deltaY<0&&atStart)||(e.deltaY>0&&atEnd))return;   /* 滑到头：把滚动交还页面，不"吃掉"用户的下滚 */
    sc.scrollLeft+=e.deltaY;e.preventDefault();
  },{passive:false});
}
/* 键盘可达性：非 button 的可点元素补 tabindex/role，能 Tab 到、回车/空格触发
   v0.6.1 修复：作用域从 #view 扩到 **#modalBox** —— 否则弹层里「③ 证 · 自测」的勾选框
   （div[data-act=chk]）键盘完全够不着。 */
function decorate(){
  $$("#view [data-act],#view [data-route-jump],#modalBox [data-act],#modalBox [data-route-jump]").forEach(function(el){
    if(el.tagName==="BUTTON")return;
    if(!el.hasAttribute("tabindex"))el.setAttribute("tabindex","0");
    if(!el.hasAttribute("role"))el.setAttribute("role","button");
  });
}
/* 顶栏实测高度 -> CSS 变量，供吸顶筛选条定位（字体放大/窄屏都不会错位） */
function syncTopbar(){
  var h=$(".topbar"); if(!h)return;
  document.documentElement.style.setProperty("--tbh",Math.round(h.getBoundingClientRect().height)+"px");
}

/* --- views --- */
function viewToday(){
  var cr=curRank(),nx=nextLevel(),d=doneCount();
  var ringPct=Math.round(d/TOTAL*100);
  var C=2*Math.PI*58;
  var hero='<div class="hero"><div class="col">'+
    '<div class="eyebrow">今日修炼</div>'+
    '<h1>你当灵魂，AI 当手脚</h1>'+
    '<p>每关 5–10 分钟，过完带走一个东西。做错不扣分，断了能续。</p>'+
    (nx
      ? '<div class="acts"><button class="btn" data-act="level" data-id="'+nx.id+'">继续修炼 · '+esc(nx.id+" "+nx.title)+'　约'+dur(nx)+'分钟</button>'+
        '<button class="btn ghost" data-route-jump="map">先看看图谱</button></div>'
      : '<div class="acts"><button class="btn'+(gradDone()?' done':'')+'" data-route-jump="grad">'+(gradDone()?'🎓 已毕业 · 回看毕业五问':'🎉 主路 '+TOTAL+' 关已走完 · 进入毕业仪式')+'</button><button class="btn ghost" data-route-jump="rank">查看段位</button></div>'
    )+
  '</div>'+
  '<div class="ring">'+ringSvg(C,ringPct)+'<div class="mid"><b>'+ringPct+'%</b><span>'+d+' / '+TOTAL+' 关</span></div></div>'+
  '</div>';

  var stats='<div class="statrow">'+
    '<div class="stat"><b>'+(S.streak||0)+'</b><span>连续打卡（天）</span></div>'+
    '<div class="stat"><b>'+cr.rank.k+'</b><span>当前段位'+(cr.span?" · "+cr.sub:"")+'</span></div>'+
    '<div class="stat"><b>'+Object.keys(S.ach).length+'</b><span>已获成就</span></div>'+
  '</div>';

  /* ① 阶段导览（v0.6.0 · 系统性感知）：六阶段路线 + 「你在这里」+「下一座山」
     把"我走到哪了"从抽象百分比变成一条能顺着看的路线，并永远给一个明确的下一个目标。 */
  var curStage=nx?nx.stage:5;
  var allStagesDone=STAGES.every(function(st){return stageDone(st.i)>=stageLevels(st.i).length});
  var curSt=STAGES.filter(function(s){return s.i===curStage})[0]||STAGES[STAGES.length-1];
  var remain=stageLevels(curStage).length-stageDone(curStage);
  var nextSt=STAGES.filter(function(s){return s.i>curStage})[0]||null;
  var climb=allStagesDone
    ? '六阶段全部走完 —— 去「毕业仪式」把整棵树收成一句话。'
    : '下一座山：走完「阶段'+curStage+' '+esc(curSt.name)+'」剩余 <b>'+remain+'</b> 关'+
      (nextSt?'，就进入「阶段'+nextSt.i+' '+esc(nextSt.name)+'」。':'，就抵达终点。');
  var bars=STAGES.map(function(st){
    var t=stageLevels(st.i).length,dn=stageDone(st.i);
    var full=t>0&&dn>=t;
    var cls=full?' done':(st.i===curStage?' on':(st.i<curStage?' past':' ahead'));
    var badge=(st.i===curStage&&!full)?'<span class="here">你在这里</span>':(full?'<span class="okb">✓</span>':'');

/* --- modal（v0.6.1：对话框语义 + 焦点进入/陷阱/归还 + 背景滚动锁与不可达） --- */
var _focusBack=null;
function openModal(html){
  var box=$("#modalBox"),md=$("#modal"),app=$(".app");
  box.innerHTML=html;
  var t=box.querySelector(".mlvl-t,.rt,.h1");
  md.setAttribute("aria-label",t?t.textContent.trim():"详情");   /* 读屏用户听得到"这是什么弹层" */
  md.classList.remove("hidden");
  document.body.classList.add("modal-open");                      /* 锁背景滚动 */
  decorate();                                                     /* 弹层内的 [data-act] 也补 tabindex/role */
  var prev=document.activeElement;
  _focusBack=(prev&&prev!==document.body)?prev:null;              /* 关掉后把焦点还给触发它的元素 */
  try{box.focus()}catch(e){}
  if(app){app.setAttribute("aria-hidden","true");if("inert" in app)app.inert=true}   /* 背景 90 个可聚焦元素一律不可达 */
}
function closeModal(){
  var md=$("#modal");if(!md||md.classList.contains("hidden"))return;
  md.classList.add("hidden");
  document.body.classList.remove("modal-open");
  var app=$(".app");if(app){app.removeAttribute("aria-hidden");if("inert" in app)app.inert=false}
  var fb=_focusBack;_focusBack=null;
  if(fb&&fb.focus){try{fb.focus()}catch(e){}}
}
/* Tab 焦点陷阱：只在弹层内循环，不让焦点跑到背景 */
function trapTab(e){
  var box=$("#modalBox"),md=$("#modal");
  if(!box||!md||md.classList.contains("hidden"))return;
  var f=$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',box)
    .filter(function(el){return el.offsetWidth>0||el.offsetHeight>0||el===document.activeElement});
  if(!f.length)return;
  var first=f[0],last=f[f.length-1],a=document.activeElement;
  if(e.shiftKey){if(a===first||a===box||!box.contains(a)){e.preventDefault();last.focus()}}
  else{if(a===last||a===box||!box.contains(a)){e.preventDefault();first.focus()}}
}

    return '<div class="check'+on+'" data-act="chk" data-id="'+id+'" data-i="'+i+'"><div class="bx">'+(on?"✓":"")+'</div>'+esc(c)+'</div>';
  }).join("");
  var loopBlk=l.loop?('<div class="h2" style="font-size:15px"><span class="dot"></span>能力闭环 · 四步自检</div><div class="steps">'+
    LOOP.map(function(s,i){return '<div class="step"><div class="k">STEP '+(i+1)+' · '+s.k+'</div><b>'+s.n+'</b><p>'+esc(s.q)+'</p></div>'}).join("")+'</div>'):"";
  /* next 三种取值：真实微关 id / "—"（本支到头）/ "毕业五问"（整棵树收尾）
     ⚠️ "毕业五问" 不是微关 id —— 直接当 id 用会渲染出一个「点了没反应」的死按钮 */
  var nxBtn=(l.next&&l.next!=="—"&&l.next!=="毕业五问")?l.next:null;
  var nxGrad=(l.next==="毕业五问");
  var idx=-1;LEVELS.forEach(function(x,i){if(x.id===id)idx=i});
  var pv=(idx>0)?LEVELS[idx-1]:null;
  var gi=GUIDE[id]||"";
  var mnav='<div class="mnav">'+
    (pv?'<button class="btn ghost sm" data-act="level" data-id="'+pv.id+'">← '+pv.id+'</button>':"")+
    (nxBtn?'<button class="btn ghost sm" data-act="level" data-id="'+nxBtn+'">'+nxBtn+' →</button>':"")+
    (nxGrad?'<button class="btn ghost sm" data-act="grad">进入毕业仪式 →</button>':"")+
    '</div>';
  var teach=TEACH[id]||"";
  /* 抛题行（v0.4.6）：先给学习对象，再进讲解 —— 防"标题说'三者'却不知哪三者" */
  var lead=LEAD[id]||l.action;
  var leadBlk='<div class="learn-lead"><span class="ll-k">本关目标</span><span class="ll-v">'+esc(lead)+'</span></div>';
  var teachBlk = teach
    ? '<div class="seg seg-teach"><div class="seg-h"><span class="seg-n">①</span> 学 · 白话讲解</div><div class="seg-b"><div class="teach">'+esc(teach)+'</div><div class="muted" style="margin-top:9px">🔴 本段为翻译层（教学编排，非官方标准）；事实以 ④ 的权威源为准。</div></div></div>'
    : '<div class="seg seg-muted"><div class="seg-h"><span class="seg-n">①</span> 学 · 白话讲解</div><div class="seg-b muted">📝 本关白话讲解编写中 —— 先用「② 做」动手，权威源见 ④。</div></div>';
  var doBlk = '<div class="seg"><div class="seg-h"><span class="seg-n">②</span> 做 · 动手</div><div class="seg-b">'+
    (lead===l.action?"":'<div class="mrow"><div class="k">这一步做什么</div><div class="v">'+esc(l.action)+'</div></div>')+
    (gi?'<div class="mrow"><div class="k">怎么做</div><div class="v">'+esc(gi)+'<div class="muted" style="margin-top:6px">🔴 引导为本产品编排（教学提示），非官方标准。</div></div></div>':"")+
    '<div class="mrow"><div class="k">过完带走</div><div class="v">'+esc(l.out)+'</div></div>'+
    '<div class="mrow"><div class="k">做对了的信号</div><div class="v">'+esc(l.fb)+'</div></div>'+
    '</div></div>';
  var proveBlk = checks?'<div class="seg"><div class="seg-h"><span class="seg-n">③</span> 证 · 自测</div><div class="seg-b"><div class="v" style="padding-top:2px">'+checks+'<div class="muted" style="margin-top:6px">勾选只是提醒；做错不扣分，重试即过关。</div></div></div></div>':"";
  var srcBlk = '<details class="seg seg-src"><summary class="seg-h"><span class="seg-n">④</span> 源 · 权威佐证 <span class="muted" style="font-weight:400">（点开核验）</span><span class="arw">▸</span></summary><div class="seg-b"><div class="mrow"><div class="k">去哪看</div><div class="v" style="font-size:13px;color:var(--ink2)"><span class="tag k">🟢 权威源</span> '+esc(n.anchor)+
      (LINK[l.node]?('<div style="margin-top:9px;display:grid;gap:7px">'+LINK[l.node].map(function(x){
        return '<a href="'+x[1]+'" target="_blank" rel="noopener noreferrer" style="color:var(--jade-ink);font-size:12.5px;text-decoration:underline">🔗 '+esc(x[0])+' ↗</a>';
      }).join("")+'</div>'):"")+
      '<div class="muted" style="margin-top:6px">本关事实以这些来源为准；'+(LINK[l.node]?"已给官方入口（可点开核验），链接核验于 2026-09-16。":"本节点锚点为通用类目，暂无单一官方页（见 L0 表 §4）。")+'</div></div></div></details>';
  var html='<button class="mclose" data-act="close">✕</button>'+
    '<div class="mlvl-id">'+l.id+' · '+esc(n.name)+' · 阶段'+l.stage+' / '+esc(n.rank)+' · 约'+dur(l)+'分钟'+(l.opt?' · ⭐选读':'')+'</div>'+
    '<div class="mlvl-t">'+esc(l.title)+'</div>'+
    (l.opt?'<div class="optnote">⭐ 这是一关「选读」：<b>不计入</b>段位小阶与毕业门槛 —— 想深挖再走，跳过也不影响主路。</div>':"")+
    leadBlk+teachBlk+doBlk+proveBlk+loopBlk+srcBlk+
    '<div class="mrow"><div class="k">下一步</div><div class="v">'+(l.next==="—"?"这一支到此为止，可回图谱选新支":(l.next==="毕业五问"?"整棵树走完了 —— 进入毕业仪式，答完五问即毕业":esc(l.next)))+'</div></div>'+
    mnav+
    '<div class="mfoot">'+(ok?'<button class="btn done">✓ 这一关已过</button><button class="btn ghost" data-act="uncomplete" data-id="'+id+'">撤销打卡</button>'
      :'<button class="btn" data-act="complete" data-id="'+id+'">完成打卡 · 拿下这一关</button>')+'</div>';
  openModal(html);
}
function nodeModal(id){
  var n=NODE_BY_ID[id];if(!n)return;
  /* 兜底（v0.6.1）：轴缺失 / 节点下无微关都不该让弹层炸掉（旧版 ls[0].id 与 a.name 都是裸解引用） */
  var ls=nodeLevels(id),a=AXES[n.axis]||{name:n.axis||"",key:"k"};
  var rows=ls.map(function(l){
    return '<div class="lv'+(S.done[l.id]?" ok":"")+'" data-act="level" data-id="'+l.id+'"><div class="mk">'+(S.done[l.id]?"✓":"")+'</div>'+
      '<div><div class="lt">'+esc(l.title)+(l.opt?' <span class="osel">⭐选读</span>':'')+'</div><div class="lid">'+l.id+'</div></div><div class="lact">'+(S.done[l.id]?"已过":"")+'</div></div>';
  }).join("");
  var html='<button class="mclose" data-act="close">✕</button>'+
    '<div class="mlvl-id">'+id+' · '+a.name+' · 阶段'+n.stage+' / '+n.rank+' · '+tmLabel(n.tm)+'</div>'+
    '<div class="mlvl-t">'+esc(n.name)+'</div>'+
    '<div class="mrow"><div class="k">学完你能</div><div class="v">'+esc(n.goal)+'</div></div>'+
    '<div class="mrow"><div class="k">带走什么</div><div class="v">'+esc(n.out)+'</div></div>'+
    '<div class="mrow"><div class="k">前置依赖</div><div class="v">'+(n.prereq.length?n.prereq.join("、"):"无（可直接开始）")+'</div></div>'+
    '<div class="mrow"><div class="k">权威锚点</div><div class="v" style="font-size:13px;color:var(--ink2)">'+esc(n.anchor)+'</div></div>'+
    '<div class="h2" style="font-size:15px"><span class="dot"></span>本节点关卡（'+ls.length+'）</div>'+(rows||'<div class="muted">本节点暂无关卡。</div>')+
    '<div class="mfoot">'+(ls.length?'<button class="btn" data-act="level" data-id="'+ls[0].id+'">从第一关开始</button>':'<button class="btn ghost" data-act="close">返回</button>')+'</div>';
  openModal(html);
}

/* --- actions --- */
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on")},1900)}
function checkAch(){
  var d=doneCount(),newly=[];
  ACHIEVEMENTS.forEach(function(a){
    if(S.ach[a.id])return;
    var ok=false;
    if(a.id==="first")ok=d>=1;
    else if(a.id==="s0")ok=stageDone(0)>=stageLevels(0).length;
    else if(a.id==="s1")ok=stageDone(1)>=stageLevels(1).length;
    else if(a.id==="half")ok=d*2>=TOTAL;   /* 过半：从总关数推导，树长长了也不用改代码（desc 文案由冒烟断言盯住不漂移） */
    else if(a.id==="loop1")ok=LEVELS.some(function(l){return l.loop&&S.done[l.id]});
    else if(a.id==="g2")ok=nodeDone("G2")>=nodeLevels("G2").length;
    else if(a.id==="f1")ok=nodeDone("F1")>=nodeLevels("F1").length;
    else if(a.id==="f2")ok=nodeDone("F2")>=nodeLevels("F2").length;
    else if(a.id==="streak3")ok=(S.streak||0)>=3;
    else if(a.id==="streak7")ok=(S.streak||0)>=7;
    if(ok){S.ach[a.id]=1;newly.push(a)}
  });
  return newly;
}
/* 过关结算卡：过关 + 带走 + 新成就 + 晋级 + 段位进度，一次说清（旧版是 toast/成就弹窗/自动跳转三层）
   零惩罚容错：这里始终留一个「撤销这一关」，不逼用户去别处找后悔药。 */
function resultModal(id,ach,rankUp){
  var l=null;LEVELS.forEach(function(x){if(x.id===id)l=x}); if(!l)return;
  var nx=nextLevel(),cr=curRank();
  var badges=ach.map(function(a){
    return '<div class="rline gold"><div class="ri">'+a.icon+'</div><div><b>成就解锁 · '+esc(a.name)+'</b><span>'+a.cat+' · '+esc(a.desc)+'</span></div></div>';
  }).join("");
  var rankLine=rankUp?('<div class="rline gold"><div class="ri">🎖️</div><div><b>晋级 · '+cr.rank.k+(cr.span?" · "+cr.sub:"")+'</b><span>'+esc(cr.rank.desc)+'</span></div></div>'):"";
  var html='<button class="mclose" data-act="close">✕</button>'+
    '<div class="result">'+
      '<div class="rc">✓</div>'+
      '<div class="rt">这一关过了</div>'+
      '<div class="rs">'+l.id+' · '+esc(l.title)+'　·　'+(nx?"还剩 "+(TOTAL-doneCount())+" 关":"全部 "+TOTAL+" 关已过")+'</div>'+
      '<div class="rline"><div class="ri">🎒</div><div><b>你带走了</b><span>'+esc(l.out)+'</span></div></div>'+
      badges+rankLine+
      '<div class="rprog"><div class="muted" style="margin-bottom:5px">本段位进度 '+cr.doneIn+' / '+cr.span+' 关'+(cr.next?' · 下一段位：'+cr.next.k:' · 已是最高段位')+'</div>'+
        '<div class="bar"><i style="width:'+Math.round(cr.ratio*100)+'%"></i></div></div>'+
      '<div class="mfoot">'+
        (nx?'<button class="btn" data-act="level" data-id="'+nx.id+'">继续下一关 · '+nx.id+'</button>'
           :'<button class="btn" data-act="grad">进入毕业仪式 · 毕业五问</button>')+
        '<button class="btn ghost" data-act="close">回到关卡列表</button>'+
      '</div>'+
      '<button class="undo" data-act="uncomplete" data-id="'+id+'">手滑了？撤销这一关</button>'+
    '</div>';
  openModal(html);
}
function complete(id){
  if(S.done[id])return;
  var before=curRank().rank.k;
  S.done[id]=Date.now();
  var t=todayStr();
  if(S.last!==t){
    var y=new Date(Date.now()-864e5);var ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    S.streak=(S.last===ys)?(S.streak||0)+1:1; S.last=t;
  }
  save();
  var ach=checkAch();
  var after=curRank().rank.k;
  save(); render();
  resultModal(id,ach,after!==before);   /* 单一结算层：不再叠 toast、不再自动跳下一关 */
}
function uncomplete(id){delete S.done[id];save();toast("已撤销（做错不扣分，随时重来）");render();levelModal(id)}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-route],[data-route-jump]");
  if(!t)return;
  var a=t.getAttribute("data-act");
  if(t.hasAttribute("data-route")){location.hash="#/"+t.getAttribute("data-route");return}
  if(t.hasAttribute("data-route-jump")){location.hash="#/"+t.getAttribute("data-route-jump");return}
  if(a==="close"){closeModal();return}
  if(a==="level"){levelModal(t.getAttribute("data-id"));return}
  if(a==="node"){nodeModal(t.getAttribute("data-id"));return}
  if(a==="complete"){complete(t.getAttribute("data-id"));return}
  if(a==="uncomplete"){uncomplete(t.getAttribute("data-id"));return}
  if(a==="chk"){
    var id=t.getAttribute("data-id"),i=+t.getAttribute("data-i");
    S.checks[id]=S.checks[id]||{};S.checks[id][i]=!S.checks[id][i];save();
    t.classList.toggle("on");$(".bx",t).textContent=t.classList.contains("on")?"✓":"";return;
  }
  if(a==="fbranch"){
    S.flt=fltDefault();S.flt.branch=t.getAttribute("data-id");save();
    if(t.getAttribute("data-goto")){location.hash="#/"+t.getAttribute("data-goto");}
    render();return;
  }
  if(a==="fstage"){
    S.flt=fltDefault();var sv=t.getAttribute("data-id");S.flt.stage=(sv==="all"?"all":Number(sv));save();render();return;
  }
  if(a==="ftodo"){
    S.flt=fltDefault();S.flt.todo=!S.flt.todo;save();render();return;
  }
  if(a==="fopt"){
    S.flt=fltDefault();S.flt.opt=!S.flt.opt;save();render();return;
  }
  if(a==="freset"){
    S.flt={branch:"all",stage:"all",todo:false,opt:false};save();render();return;
  }
  if(a==="grad"){closeModal();location.hash="#/grad";return}
  if(a==="gq"){
    var gk=t.getAttribute("data-k");S.grad=S.grad||{};S.grad[gk]=!S.grad[gk];save();render();
    if(gradDone())setTimeout(function(){toast("🎓 五问全过 —— 你已毕业")},180);
    return;
  }
  if(a==="reset"){
    if(confirm("确定清空本机进度吗？（演示用，不可恢复）")){S=fresh();save();render();toast("已重置，回到萌新")}
    return;
  }
  if(a==="start"){
    S.started=true;save();$("#onboard").classList.add("hidden");
    setTimeout(function(){var n=nextLevel();if(n)levelModal(n.id)},350);return;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="gsearch"){
    var q=e.target.value.trim().toLowerCase(),hit=0;
    $$("#glist .gitem").forEach(function(el){
      var on=(el.getAttribute("data-term")||"").toLowerCase().indexOf(q)>=0;
      el.style.display=on?"":"none";if(on)hit++;
    });
    /* v0.6.1：搜不到时给一句话，别让用户对着空白猜（旧版零反馈） */
    var em=$("#gempty");if(em)em.classList.toggle("hidden",hit>0);
  }
});
$("#modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeModal();return}
  if(e.key==="Tab"){trapTab(e);return}
  if(e.key==="Enter"||e.key===" "){
    var t=e.target&&e.target.closest?e.target.closest("[data-act],[data-route-jump]"):null;
    if(t&&t.tagName!=="BUTTON"){e.preventDefault();t.click()}
  }
});
window.addEventListener("hashchange",render);
window.addEventListener("resize",syncTopbar);

/* --- boot --- */
/* 崩溃兜底（v0.6.1）：未捕获异常不再"只在控制台消失"——给用户一句人话，并提示可能的进度风险。
   只提示前两次，避免同一错误反复刷屏；仍返回 false，保留浏览器默认记录。 */
var _errShown=0;
window.onerror=function(){
  if(_errShown<2){_errShown++;try{toast("⚠️ 页面遇到一个小问题 —— 若刚打卡没反应，请再点一次「完成打卡」")}catch(e){}}
  return false;
};
fillNav();
if(!S.started){$("#onboard").classList.remove("hidden")}
render();
syncTopbar();
window.addEventListener("load",syncTopbar);   /* 字体加载完顶栏高度可能变，再同步一次 */
</script>
</body>
</html>
